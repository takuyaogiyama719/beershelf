    ensureArt(id); queueHD([id]);
    const nt = state.tiers.findIndex((r) => r.includes(id));
    requestAnimationFrame(() => { shelf.scrollToCan(id); setTimeout(() => shelf.flash(id), 350); });
    toast(nt === t ? `${t + 1}段目の右端に置きました。長押しで並べ替えできます` : `${t + 1}段目が満杯のため、${nt + 1}段目に置きました`);
  }
  /* ---------- ズーム表示（F-01）＋ ビール情報（F-05） ----------
   * 棚の缶をタップすると、その位置から缶が持ち上がって画面中央まで拡大する（FLIP アニメーション）。
   * 拡大中は高画質画像（縦1400px）に差し替え、下（PC では右）に情報と管理操作を出す。
   * 閉じる：下へスワイプ／背景タップ／✕／Esc。左右スワイプ（PC は ‹ › や矢印キー）で隣の缶へ。 */
  let zoom = null;

  /* 情報項目の定義。項目を増やすときはここに足す（未登録の項目は表示しない） */
  const INFO_FIELDS = [
    { key: 'country', label: '国', get: (c) => c.country },
    { key: 'style', label: '種別', get: (c) => c.style || (c.demo && c.demo.style) },
    { key: 'volume', label: '容量', get: (c) => (c.volumeMl ? `${c.volumeMl}ml` : '') },
  ];
  /* 隣の缶（棚の並び順 → バックヤードの順） */
  function neighborOf(id, dir) {
    const list = onShelf(id) ? state.tiers.flat() : state.backyard;
    const i = list.indexOf(id);
    return i < 0 ? null : list[i + dir] || null;
  }
  function sourceImg(id) {
    if (document.body.dataset.view === 'backyard') return document.querySelector(`.by-item[data-id="${id}"] img`);
    const el = shelf.els.get(id);
    return el ? el.querySelector('.can-img') : null;
  }
  function visibleRect(img) {
    if (!img) return null;
    const r = img.getBoundingClientRect();
    if (!r.width || r.bottom < 0 || r.top > innerHeight || r.right < 0 || r.left > innerWidth) return null;
    return r;
  }

  function zoomPanelHTML(can) {
    const id = can.id, shelfNow = onShelf(id), br = brewery(can);
    const chips = INFO_FIELDS.map((f) => [f, f.get(can)]).filter(([, v]) => v);
    return `
      <div class="zoom-grip" aria-hidden="true"></div>
      ${br ? `<div class="sheet-brewery">${esc(br)}</div>` : ''}
      <h2 class="sheet-name">${esc(can.beerName)}</h2>
      ${chips.length ? `<dl class="zoom-chips">${chips.map(([f, v]) => `<div class="chip" data-k="${f.key}"><dt>${f.label}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>` : ''}
      <dl class="sheet-meta">
        <dt>飲んだ日</dt><dd>${fmtDate(can.drankOn)}</dd>
        ${can.review ? `<dt>レビュー</dt><dd>${esc(can.review)}</dd>` : ''}
        ${can.tone && can.tone.glare > 0.03 ? '<dt>撮影</dt><dd class="muted">強い反射あり（撮り直すときれいになります）</dd>' : ''}
      </dl>
      <div class="sheet-memo" hidden><img alt="思い出の写真"></div>
      ${can.panoImagePath ? '<button class="btn ghost wide spin-open" data-act="spin">360° で見る</button>' : ''}
      <div class="sheet-actions">
        <button class="btn ghost" data-act="edit">${icon('edit')}編集</button>
        <button class="btn ${shelfNow ? 'ghost' : 'primary'}" data-act="move">${icon(shelfNow ? 'box' : 'shelf')}${shelfNow ? 'バックヤードへ' : '棚に置く'}</button>
        <button class="btn danger" data-act="delete">${icon('trash')}削除</button>
      </div>
      <div class="tier-pick" hidden>
        <p>どの段に置きますか？（その段の右端に追加。満杯なら次の段へ）</p>
        <div class="tier-btns">
          ${state.tiers.map((r, t) => `<button class="btn ghost" data-tier="${t}"><b>${t + 1}段目</b><small>${r.length}/${shelf.perTier}本</small></button>`).join('')}
          <button class="btn ghost" data-tier="${state.tiers.length}"><b>新しい段</b><small>いちばん下</small></button>
        </div>
        <button class="btn ghost wide" data-act="cancel-pick">キャンセル</button>
      </div>`;
  }

  /* 拡大後の缶の大きさと位置（画像本来の縦横比で、ステージに収まる最大サイズ） */
  function zoomTarget(can) {
    const st = zoom.root.querySelector('.zoom-stage').getBoundingClientRect();
    const asp = can.cutoutAspect || NS.canArt.ASPECT;
    let h = st.height * 0.88, w = h * asp;
    if (w > st.width * 0.8) { w = st.width * 0.8; h = w / asp; }
    return { left: st.left + (st.width - w) / 2, top: st.top + (st.height - h) / 2 + st.height * 0.01, width: w, height: h };
  }
  function placeImg(img, r) {
    Object.assign(img.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
  }
  /* from（棚の缶の位置）から to（拡大位置）へ、transform だけで動かす */
  function flip(img, from, to, ms, done) {
    img.style.transition = 'none';
    img.style.transform = `translate(${from.left - to.left}px,${from.top - to.top}px) scale(${from.width / to.width},${from.height / to.height})`;
    void img.offsetWidth;
    img.style.transition = `transform ${ms}ms cubic-bezier(.2,.8,.2,1)`;
    img.style.transform = 'none';
    setTimeout(done || (() => {}), ms + 20);
  }

  function openDetail(id) {
    const can = byId(id);
    if (!can) return;
    const root = $('#modal-root');
    root.innerHTML = `
      <div class="zoom" role="dialog" aria-modal="true" aria-label="${esc(can.beerName)}">
        <div class="zoom-backdrop" data-close></div>
        <div class="zoom-stage" data-close><div class="zoom-spot"></div></div>
        <img class="zoom-img" alt="${esc(can.beerName)}" draggable="false">
        <div class="zoom-floor"></div>
        <button class="zoom-x icon-btn" data-close aria-label="閉じる">✕</button>
        <button class="zoom-nav prev" data-nav="-1" aria-label="前の缶">‹</button>
        <button class="zoom-nav next" data-nav="1" aria-label="次の缶">›</button>
        <section class="zoom-panel"></section>
      </div>`;
    root.classList.add('open');
    zoom = { root, id, openedAt: performance.now() };
    const img = root.querySelector('.zoom-img');
    fillZoom(can);
    const src = sourceImg(id), from = visibleRect(src);
    img.src = artURL.get(id) || (src && src.src) || '';
    const to = zoom.to = zoomTarget(can);
    placeImg(img, to); placeFloor(to);
    if (src) src.closest('.can, .by-can').classList.add('lifted');
    zoom.lifted = src && src.closest('.can, .by-can');
    requestAnimationFrame(() => root.classList.add('visible'));
    if (from) flip(img, from, to, 420, () => loadDetailArt(id, img));
    else { img.classList.add('pop'); loadDetailArt(id, img); }
    bindZoomGestures();
    root.onclick = onZoomClick;
  }

  function placeFloor(r) {
    const f = zoom.root.querySelector('.zoom-floor');
    Object.assign(f.style, { left: (r.left - r.width * 0.1) + 'px', top: (r.top + r.height - r.width * 0.09) + 'px', width: (r.width * 1.2) + 'px', height: (r.width * 0.2) + 'px' });
  }

  function fillZoom(can) {
    const root = zoom.root, panel = root.querySelector('.zoom-panel');
    panel.innerHTML = zoomPanelHTML(can);
    panel.scrollTop = 0;
    root.querySelector('.zoom').setAttribute('aria-label', can.beerName);
    root.querySelector('.zoom-nav.prev').hidden = !neighborOf(can.id, -1);
    root.querySelector('.zoom-nav.next').hidden = !neighborOf(can.id, 1);
    if (can.memoryImagePath) NS.images.urlFor(can.memoryImagePath).then((u) => {
      const box = panel.querySelector('.sheet-memo'); if (!u || !box) return;
      const im = box.querySelector('img');
      im.onload = () => { box.hidden = false; };
      im.onerror = async () => {          // 読み込みに失敗したら一度だけ作り直す。それでもだめなら枠ごと隠す
        if (im._retry) { box.hidden = true; return; }
        im._retry = true; NS.images.forget(can.memoryImagePath);
        const u2 = await NS.images.urlFor(can.memoryImagePath); if (u2) im.src = u2; else box.hidden = true;
      };
      im.src = u;
    });
  }

  /* 隣の缶へ（横にすべらせて入れ替え） */
  function zoomGo(dir) {
    if (!zoom || zoom.busy) return;
    const nid = neighborOf(zoom.id, dir);
    if (!nid) return;
    const can = byId(nid), img = zoom.root.querySelector('.zoom-img');
    zoom.busy = true;
    img.style.transition = 'transform .18s ease-in, opacity .18s ease-in';
    img.style.transform = `translateX(${-dir * 40}px)`; img.style.opacity = '0';
    setTimeout(() => {
      if (!zoom) return;
      if (zoom.lifted) zoom.lifted.classList.remove('lifted');
      zoom.id = nid;
      const src = sourceImg(nid);
      zoom.lifted = src && src.closest('.can, .by-can');
      if (zoom.lifted) zoom.lifted.classList.add('lifted');
      if (onShelf(nid) && document.body.dataset.view === 'shelf') shelf.scrollToCan(nid, true);
      fillZoom(can);
      delete img.dataset.hd;
      img.src = artURL.get(nid) || '';
      const to = zoom.to = zoomTarget(can); placeImg(img, to); placeFloor(to);
      img.style.transition = 'none'; img.style.transform = `translateX(${dir * 40}px)`;
      void img.offsetWidth;
      img.style.transition = 'transform .24s cubic-bezier(.2,.8,.2,1), opacity .24s ease-out';
      img.style.transform = 'none'; img.style.opacity = '1';
      loadDetailArt(nid, img);
      setTimeout(() => { if (zoom) zoom.busy = false; }, 250);
    }, 180);
  }

  function closeZoom() {
    if (!zoom) return;
    const z = zoom; zoom = null;
    const root = z.root, img = root.querySelector('.zoom-img');
    root.classList.remove('visible');
    const src = sourceImg(z.id), to = visibleRect(src), base = z.to;
    if (to && img && base) {
      // 棚の元の位置へ戻す（transform は拡大位置 base を基準に計算）
      img.style.transition = 'transform .34s cubic-bezier(.4,0,.2,1)';
      img.style.transform = `translate(${to.left - base.left}px,${to.top - base.top}px) scale(${to.width / base.width},${to.height / base.height})`;
    } else if (img) {
      img.style.transition = 'transform .25s ease, opacity .25s ease';
      img.style.transform = 'scale(.9)'; img.style.opacity = '0';
    }
    setTimeout(() => {
      if (z.lifted) z.lifted.classList.remove('lifted');
      if (!zoom) { root.classList.remove('open'); root.innerHTML = ''; }
    }, to ? 340 : 260);
  }

  function onZoomClick(e) {
    if (!zoom) return;
    // タップ直後の合成 click や、スワイプ直後の click では閉じない
    if (performance.now() - zoom.openedAt < 400 || zoom.swiped) { zoom.swiped = false; return; }
    const id = zoom.id, can = byId(id), root = zoom.root;
    const nav = e.target.closest('[data-nav]');
    if (nav) return zoomGo(+nav.dataset.nav);
    if (e.target.closest('[data-close]') && !e.target.closest('.zoom-panel')) return closeModal();
    const tier = e.target.closest('[data-tier]');
    if (tier) { closeModal(); placeOnShelf(id, +tier.dataset.tier); return; }
    const act = e.target.closest('[data-act]');
    if (!act) return;
    const a = act.dataset.act;
    const pick = root.querySelector('.tier-pick'), acts = root.querySelector('.sheet-actions');
    if (a === 'edit') { closeModal(); editEntry(can); }
    if (a === 'spin') openSpin(can);
    if (a === 'move') {
      if (onShelf(id)) { closeModal(); moveToBackyard(id); }
      else { pick.hidden = false; acts.hidden = true; }
    }
    if (a === 'cancel-pick') { pick.hidden = true; acts.hidden = false; }
    if (a === 'delete') confirmDelete(can);
  }

  /* 指の動き：下へ → 閉じる、左右 → 隣の缶。パネル内は普通にスクロールできる */
  function bindZoomGestures() {
    const root = zoom.root, z = root.querySelector('.zoom'), img = root.querySelector('.zoom-img');
    const panel = root.querySelector('.zoom-panel'), bd = root.querySelector('.zoom-backdrop');
    let g = null;
    z.addEventListener('pointerdown', (e) => {
      if (!zoom || zoom.busy || e.target.closest('button, input, textarea, select, a')) return;
      if (e.pointerType === 'mouse') return;   // PC はボタン・キー操作（‹ › ← → Esc）
      const inPanel = !!e.target.closest('.zoom-panel');
      g = { x0: e.clientX, y0: e.clientY, t0: performance.now(), id: e.pointerId, axis: null, inPanel, scrollTop: panel.scrollTop };
    });
    z.addEventListener('pointermove', (e) => {
      if (!g || e.pointerId !== g.id) return;
      const dx = e.clientX - g.x0, dy = e.clientY - g.y0;
      if (!g.axis) {
        if (Math.hypot(dx, dy) < 10) return;
        g.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
        if (g.axis === 'y' && (dy < 0 || (g.inPanel && g.scrollTop > 0))) { g = null; return; }   // パネルのスクロールに任せる
        img.style.transition = 'none'; panel.style.transition = 'none';
      }
      if (g.axis === 'y') {
        const d = Math.max(0, dy);
        img.style.transform = `translateY(${d}px) scale(${1 - Math.min(d, 400) / 1600})`;
        panel.style.transform = `translateY(${d}px)`;
        bd.style.opacity = String(Math.max(0.15, 1 - d / 380));
      } else {
        img.style.transform = `translateX(${dx * 0.6}px)`;
      }
      g.dx = dx; g.dy = dy;
    });
    const end = (e) => {
      if (!g || e.pointerId !== g.id) return;
      const gg = g; g = null;
      if (!gg.axis) return;
      zoom.swiped = true; setTimeout(() => { if (zoom) zoom.swiped = false; }, 60);
      const dt = performance.now() - gg.t0;
      panel.style.transition = 'transform .25s ease'; panel.style.transform = '';
      bd.style.opacity = '';
      if (gg.axis === 'y' && (gg.dy > 90 || (gg.dy > 30 && gg.dy / dt > 0.6))) { closeModal(); return; }
      if (gg.axis === 'x' && Math.abs(gg.dx) > 60 && neighborOf(zoom.id, gg.dx < 0 ? 1 : -1)) { zoomGo(gg.dx < 0 ? 1 : -1); return; }
      img.style.transition = 'transform .25s cubic-bezier(.2,.8,.2,1)'; img.style.transform = 'none';
    };
    z.addEventListener('pointerup', end);
    z.addEventListener('pointercancel', end);
  }

  /* 360° ビュー（全画面） */
  async function openSpin(can) {
    const url = await NS.images.urlFor(can.panoImagePath);
    if (!url) { toast('360° の画像が見つかりませんでした'); return; }
    const box = document.createElement('div');
    box.className = 'spin-full';
    box.innerHTML = `
      <header><h3>${esc(can.beerName)}</h3><button class="icon-btn" data-x aria-label="閉じる">✕</button></header>
      <div class="spin-stage"><canvas class="spin-cv"></canvas></div>
      <p class="spin-hint">左右にドラッグして回せます</p>
      ${can.panoStats ? `<p class="gen-debug">${NS.spin360.fmtStats(can.panoStats)}</p>` : ''}`;
    document.body.appendChild(box);
    const v = new NS.spin360.Viewer(box.querySelector('.spin-cv'), url, can.panoAspect || 2.0);
    box.querySelector('[data-x]').onclick = () => { v.destroy(); box.remove(); };
  }

  /* シートを下にスワイプして閉じる（指に追従。80px 以上か、素早く払ったら閉じる） */
  function enableSwipe(sheet) {
    if (!sheet) return;
    let y0 = 0, dy = 0, t0 = 0, active = false, id = null;
    sheet.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button, input, textarea, select, a, .spin-stage')) return;
      if (sheet.scrollTop > 0) return;
      active = true; id = e.pointerId; y0 = e.clientY; dy = 0; t0 = performance.now();
      sheet.style.transition = 'none';
    });
    window.addEventListener('pointermove', (e) => {
      if (!active || e.pointerId !== id) return;
      dy = Math.max(0, e.clientY - y0);
      sheet.style.transform = `translateY(${dy}px)`;
      const bd = sheet.parentElement.querySelector('.sheet-backdrop');
      if (bd) bd.style.opacity = String(Math.max(0.2, 1 - dy / 400));
    });
    const end = (e) => {
      if (!active || (e && e.pointerId !== id)) return;
      active = false;
      const v = dy / Math.max(1, performance.now() - t0);
      sheet.style.transition = '';
      const bd = sheet.parentElement.querySelector('.sheet-backdrop');
      if (dy > 80 || (v > 0.6 && dy > 20)) { sheet.style.transform = 'translateY(105%)'; closeModal(); }
      else { sheet.style.transform = ''; if (bd) bd.style.opacity = ''; }
    };
    window.addEventListener('pointerup', end);
    window.addEventListener('pointercancel', end);
  }

  function closeModal() {
    if (zoom) return closeZoom();
    const root = $('#modal-root');
    root.classList.remove('visible');
    setTimeout(() => { root.classList.remove('open'); root.innerHTML = ''; }, 260);
  }

  /* 確認ダイアログ（誤操作防止）。Promise<boolean> */
  function askConfirm({ title, body, ok }) {
    return new Promise((resolve) => {
      const root = $('#modal-root');
      const standalone = !root.classList.contains('open');
      if (standalone) root.classList.add('open', 'visible');
      const box = document.createElement('div');
      box.className = 'confirm';
      box.innerHTML = `
        <div class="confirm-card" role="alertdialog" aria-modal="true">
          <h3>${esc(title)}</h3><p>${esc(body)}</p>
          <div class="confirm-actions">
            <button class="btn ghost" data-c="no">キャンセル</button>
            <button class="btn danger solid" data-c="yes">${esc(ok)}</button>
          </div>
        </div>`;
      root.appendChild(box);
      requestAnimationFrame(() => box.classList.add('visible'));
      box.addEventListener('click', (e) => {
        e.stopPropagation();
        const c = e.target.closest('[data-c]');
        if (!c && e.target !== box) return;
        const yes = !!c && c.dataset.c === 'yes';
        box.classList.remove('visible');
        setTimeout(() => { box.remove(); if (standalone) root.classList.remove('open', 'visible'); }, 200);
        resolve(yes);
      });
    });
  }

  async function confirmDelete(can) {
    const yes = await askConfirm({
      title: 'この缶を削除しますか？',
      body: `「${can.beerName}」の写真・飲んだ日・レビューも削除されます。この操作は取り消せません。`,
      ok: '削除する',
    });
    if (!yes) return;
    state.tiers = state.tiers.map((r) => r.filter((x) => x !== can.id));
    state.backyard = state.backyard.filter((x) => x !== can.id);
    state.cans = state.cans.filter((x) => x.id !== can.id);
    shelf.state = state; shelf.render();
    NS.images.removeEntryImages(can);
    artURL.delete(can.id);
    persist();
    if (document.body.dataset.view === 'backyard') renderBackyard();
    closeModal();
    toast('削除しました');
  }

  /* ---------- 表示設定 ---------- */
  function openSettings() {
    const root = $('#modal-root');
    const sw = (k) => `<button class="switch" role="switch" aria-checked="${NS.settings[k]}" data-set="${k}"></button>`;
    root.innerHTML = `
      <div class="sheet-backdrop" data-close></div>
      <section class="sheet" role="dialog" aria-modal="true" aria-label="表示設定">
        <div class="sheet-grip"></div>
        <h3 class="sheet-title">表示設定</h3>
        <div class="set-list">
          <div class="set-row"><div><b>缶画像の正規化</b><small>缶ごとに保存した補正値で、明るさ・色温度・コントラストのばらつきを補正して表示します（ラベルの色は維持）。OFF にすると補正前の切り抜きを表示します</small></div>${sw('normalize')}</div>
          <div class="set-block"><b>1段に並べる本数</b><small>缶の大きさは、この本数が画面の幅に収まるように自動で調整されます（この画面幅での本数）</small>
            <div class="seg seg3" data-group="density">${[['few', '少なめ'], ['std', '標準'], ['many', '多め']].map(([k, l]) =>
              `<button data-v="${k}" aria-selected="${NS.settings.density === k}">${l}<small>${NS.data.perTier(shelfWidth(), k)}本</small></button>`).join('')}</div></div>
          <div class="set-block"><b>ライティング</b><small>棚の照明の色・強さと陰影を切り替えます（缶の画像そのものの色は変えません）</small>
            <div class="seg seg4" data-group="light">${[['bright', '明るめ'], ['standard', '標準'], ['dark', '暗め'], ['warm', '暖色']].map(([k, l]) =>
              `<button data-v="${k}" aria-selected="${NS.settings.light === k}">${l}</button>`).join('')}</div></div>
          <div class="set-row"><div><b>缶の明るさ</b><small>撮影した缶の画像の明るさ（中間の明るさを持ち上げます）</small></div><output class="bri-val">${Math.round(NS.settings.brightness * 100)}%</output></div>
          <input type="range" class="bri" min="0.9" max="1.6" step="0.05" value="${NS.settings.brightness}" aria-label="缶の明るさ">
        </div>
        <button class="btn ghost wide" data-act="reprocess">登録した缶の画像を再処理</button>
        <p class="set-note">保存してある元の写真から、切り抜き・傾き・明るさの補正を最新の方法で作り直します。失敗した缶は今の画像のままです。</p>
        <button class="btn danger wide" data-act="reset">初期状態に戻す</button>
      </section>`;
    root.classList.add('open');
    requestAnimationFrame(() => root.classList.add('visible'));
    enableSwipe(root.querySelector('.sheet'));
    const bri = root.querySelector('.bri'); let briT = 0;
    bri.addEventListener('input', () => {
      root.querySelector('.bri-val').textContent = Math.round(bri.value * 100) + '%';
      clearTimeout(briT);
      briT = setTimeout(() => { NS.settings.brightness = +bri.value; NS.data.saveSettings(); refreshAllArt((c) => c.tone); }, 250);
    });
    root.onclick = async (e) => {
      if (e.target.closest('[data-close]')) return closeModal();
      const sg = e.target.closest('.seg [data-v]');
      if (sg) {
        const group = sg.parentElement.dataset.group;
        NS.settings[group] = sg.dataset.v;
        sg.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-selected', b === sg));
        NS.data.saveSettings();
        if (group === 'light') applyLight();
        if (group === 'density') { reflowShelf(); NS.data.save(state); shelf.scroller.scrollTop = 0; }
        return;
      }
      const t = e.target.closest('[data-set]');
      if (t) {
        const k = t.dataset.set;
        NS.settings[k] = !NS.settings[k];
        t.setAttribute('aria-checked', NS.settings[k]);
        NS.data.saveSettings();
        if (k === 'lighting') document.body.classList.toggle('light-off', !NS.settings.lighting);
        if (k === 'normalize') {
          refreshAllArt((c) => c.cutoutImagePath);
        }
        return;
      }
      const rp = e.target.closest('[data-act="reprocess"]');
      if (rp) {
        const targets = state.cans.filter((c) => c.originalImagePath && c.originalImagePath.startsWith('idb:'));
        if (!targets.length) { toast('再処理できる登録画像はありません（初期の缶は処理済み）'); return; }
        rp.disabled = true;
        let ok = 0, ng = 0;
        for (const c of targets) {
          rp.textContent = `再処理中… ${ok + ng + 1} / ${targets.length}`;
          try {
            const patch = await NS.register.reprocess(c);
            if (patch) { Object.assign(c, patch); c.toneRev = (c.toneRev || 0) + 1; await ensureArt(c.id, true); ok++; } else ng++;
          } catch (err) { ng++; }
        }
        persist(); shelf.render();
        rp.disabled = false; rp.textContent = '登録した缶の画像を再処理';
        toast(`再処理：${ok} 本完了${ng ? `、${ng} 本は元の画像のまま` : ''}`);
        return;
      }
      if (e.target.closest('[data-act="reset"]')) {
        const yes = await askConfirm({ title: '初期状態に戻す', body: '登録した缶・並び順を消して、初期状態（撮影した57本）に戻します。', ok: '初期化する' });
        if (!yes) return;
        NS.data.reset();
        await NS.images.clearAll();
        location.reload();
      }
    };
  }

  /* ---------- 登録・編集 ---------- */
  function register() {
    NS.register.startRegister(async (entry) => {
      state.cans.unshift(entry);
      state.backyard.unshift(entry.id);
      persist();
      await ensureArt(entry.id);
      setView('backyard');
      renderBackyard(entry.id);
      $('.by-scroll').scrollTop = 0;
      toast(NS.images.persistent ? 'バックヤードに追加しました' : 'バックヤードに追加しました（この環境では画像は再読み込みで消えます）');
    });
  }

  function editEntry(can) {
    NS.register.startEdit(can, async (patch, newCut) => {
      Object.assign(can, patch);
      if (newCut) can.toneRev = (can.toneRev || 0) + 1;
      persist();
      shelf.render();
      if (newCut) await ensureArt(can.id, true);
      const img = shelf.els.get(can.id) && shelf.els.get(can.id).querySelector('img');
      if (img) img.alt = can.beerName;
      if (document.body.dataset.view === 'backyard') renderBackyard();
      toast('保存しました');
    });
  }

  function icon(name) {
    const p = {
      edit: '<path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M14 6l4 4"/>',
      box: '<path d="M3 7l9-4 9 4v10l-9 4-9-4V7z"/><path d="M3 7l9 4 9-4M12 11v10"/>',
      shelf: '<path d="M3 4v16M21 4v16M3 10h18M3 16h18"/>',
      trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
    }[name];
    return `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  }

  /* ライティング（F-04）：棚の照明だけを切り替える。缶の画像の補正値は変えない */
  function applyLight() {
    const v = ['bright', 'standard', 'dark', 'warm'].includes(NS.settings.light) ? NS.settings.light : 'standard';
    document.body.dataset.light = v;
    document.body.classList.remove('light-off');
  }

  function installTextures() {
    const t = NS.assets.tex, root = document.documentElement.style;
    root.setProperty('--tex-board', `url(${t.board})`);
    root.setProperty('--tex-edge', `url(${t.edge})`);
    root.setProperty('--tex-wall', `url(${t.wall})`);
    root.setProperty('--tex-pillar', `url(${t.pillar})`);
    const ph = NS.assets.photo;
    if (ph) ['band', 'mid', 'board', 'pillar'].forEach((k) => root.setProperty('--ph-' + k, `url(${ph[k]})`));
  }

  function init() {
    installTextures();
    state = NS.data.load();
    NS.data.reflow(state, NS.data.perTier(shelfWidth()));
    shelf = new NS.Shelf($('#shelf'), state, {
      perTier: NS.data.perTier(shelfWidth()),
      onTap: openDetail,
      onChange: persist,
      onToBackyard: (id) => moveToBackyard(id),
      dropZone: $('#tab-backyard'),
    });
    NS.app.shelf = shelf;
    NS.app.getState = () => state;
    updateHeader();
    generateArt();

    let rz;
    window.addEventListener('resize', () => {
      clearTimeout(rz);
      rz = setTimeout(() => {
        reflowShelf(); NS.data.save(state);
        if (zoom) { const c = byId(zoom.id), im = zoom.root.querySelector('.zoom-img'); const to = zoom.to = zoomTarget(c); placeImg(im, to); placeFloor(to); }
      }, 140);
    });
    document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => setView(t.dataset.view)));
    $('#fab').addEventListener('click', register);
    $('#by-grid').addEventListener('click', (e) => {
      const b = e.target.closest('.by-item');
      if (b) openDetail(b.dataset.id);
    });
    $('#btn-settings').addEventListener('click', openSettings);
    applyLight();
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
      if (zoom && !document.querySelector('.confirm') && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) zoomGo(e.key === 'ArrowLeft' ? -1 : 1);
    });
  }

  NS.app = { init, toast };
  document.addEventListener('DOMContentLoaded', init);
})(window.CanShelf = window.CanShelf || {});
</script>
</body>
</html>
