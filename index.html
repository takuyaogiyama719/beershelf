<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1a0f08">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CanShelf — マイシェルフ</title>
<style>
:root {
  --gold: #e8b765;
  --gold-2: #c98d3c;
  --ink: #f5e9d6;
  --ink-2: #c9a77a;
  --bg: #120a05;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overscroll-behavior: none; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Noto Sans CJK JP", "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased; overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

#app { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; }

/* ---------- ヘッダー ---------- */
.topbar {
  position: relative; z-index: 10;
  display: grid; grid-template-columns: 44px 1fr 44px; align-items: center;
  padding: calc(6px + var(--safe-t)) 10px 6px;
  background: linear-gradient(#1d1109, #150b05);
  box-shadow: 0 1px 0 rgba(232, 183, 101, .12), 0 6px 16px rgba(0, 0, 0, .55);
}
.title { text-align: center; line-height: 1.25; }
.title h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: .08em; color: var(--ink); }
.title p { margin: 2px 0 0; font-size: 12px; color: var(--ink-2); letter-spacing: .04em; }
.title p span { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--gold); }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #e6d6bf; }
.icon-btn:active { background: rgba(255, 255, 255, .08); }
.icon-btn.placeholder { visibility: hidden; }

/* ---------- 棚 ---------- */
.views { position: relative; min-height: 0; }
.view { position: absolute; inset: 0; transition: opacity .22s ease; }
body[data-view="shelf"] #backyard, body[data-view="backyard"] #shelf { opacity: 0; pointer-events: none; visibility: hidden; }
.shelf { min-height: 0; }
.shelf-viewport { position: absolute; inset: 0; overflow: hidden; background: #1a0e06; }
.shelf-scroller {
  position: absolute; inset: 0; overflow-x: hidden; overflow-y: auto;
  touch-action: pan-y; overscroll-behavior-y: contain; scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.shelf-scroller::-webkit-scrollbar { display: none; }
.is-dragging .shelf-scroller { touch-action: none; }
.shelf-content { position: relative; min-width: 100%; }
.cabinet { position: absolute; inset: 0; }

.top-frame {
  position: absolute; top: 0; left: 0; right: 0; height: var(--top-frame); z-index: 3;
  background: linear-gradient(to bottom, rgba(0, 0, 0, .5), rgba(255, 210, 150, .1) 70%, rgba(0, 0, 0, .5)), var(--tex-edge);
  background-size: auto, 760px 100%;
  box-shadow: 0 3px 6px rgba(0, 0, 0, .6);
}
.tier { position: absolute; left: 0; right: 0; height: var(--row-h); }
.wall {
  position: absolute; inset: 0;
  /* 背面の古材。上の棚板の真下はいったん陰になり、LED の光で上半分が明るく、下に向かって暗く沈む */
  background:
    linear-gradient(to bottom, rgba(8, 3, 0, .75) 0, rgba(8, 3, 0, .32) 6%, rgba(8, 3, 0, .42) 35%, rgba(8, 3, 0, .7) 75%, rgba(8, 3, 0, .86) 100%),
    var(--tex-wall);
  background-size: auto, 1100px auto;
  filter: brightness(var(--wall-b, 1)) saturate(var(--wall-s, 1)); transition: filter .45s ease;
}
/* 上の棚板の裏に仕込んだ LED の光 */
.glow {
  position: absolute; inset: var(--under, 0px) 0 0 0; mix-blend-mode: screen; pointer-events: none;
  /* 棚板の裏の LED テープ：帯状の暖色光が背面と缶の上部を照らす */
  background:
    linear-gradient(to bottom, rgba(255, 214, 150, .95) 0, rgba(255, 186, 110, .5) 2px, rgba(255, 170, 90, 0) 6px),
    linear-gradient(to bottom, rgba(255, 170, 80, .0) 0, rgba(255, 172, 86, .42) 2%, rgba(245, 135, 50, .22) 14%, rgba(225, 110, 35, .08) 45%, rgba(0, 0, 0, 0) 75%);
  opacity: var(--glow-o, 1); transition: opacity .45s ease;
}
/* スポットライト（横に繰り返し） */
.spots {
  position: absolute; inset: 0; mix-blend-mode: screen; pointer-events: none;
  top: var(--under, 0px); background-repeat: no-repeat;
  opacity: calc(.6 * var(--spot-o, 1)); transition: opacity .45s ease;
}
.board-top {
  position: absolute; left: 0; right: 0; bottom: var(--board-front); height: var(--top-vis, var(--board-top));
  background: linear-gradient(to bottom, rgba(20, 9, 2, .6), rgba(255, 205, 140, .06) 50%, rgba(255, 222, 170, .16)), var(--tex-board);
  background-size: auto, 760px auto; background-position: 0 0, 0 60%;
}
.board-front {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--board-front); z-index: 1;
  background:
    linear-gradient(to bottom, rgba(255, 196, 120, .55) 0, rgba(255, 170, 90, .18) 2px, rgba(255, 150, 70, .06) 25%, rgba(0, 0, 0, .18) 70%, rgba(0, 0, 0, .55) 100%),
    var(--tex-edge);
  background-size: auto, 760px auto; background-position: 0 0, 0 50%;
  box-shadow: 0 5px 9px rgba(0, 0, 0, .55);
}
/* 目線より上の段：上の棚板の裏側と、そこに仕込んだ LED の線が見える */
.board-under {
  position: absolute; left: 0; right: 0; top: 0; height: var(--under, 0px); pointer-events: none;
  background:
    linear-gradient(to bottom, rgba(0, 0, 0, .55), rgba(0, 0, 0, .25) 55%, rgba(255, 214, 150, .95) calc(100% - 2px), rgba(255, 190, 110, .6) 100%),
    var(--tex-edge);
  background-size: auto, 760px auto;
}
/* 写真らしさ：微細な粒状感と周辺減光（全体に一様） */
.film {
  position: absolute; inset: 0; pointer-events: none; z-index: 7;
  background:
    radial-gradient(ellipse 120% 95% at 50% 45%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, .38) 100%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.5'/></svg>");
  mix-blend-mode: overlay; opacity: calc(.22 * var(--film-o, 1)); transition: opacity .45s ease;
}
/* ライティング（F-04）の色かぶり・周辺の暗さ。缶の画像そのものには触らず、棚全体に薄く重ねる */
.shelf-viewport::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 7;
  background: var(--tint, none); mix-blend-mode: var(--tint-blend, soft-light); opacity: var(--tint-o, 0); transition: opacity .45s ease;
}
body[data-light="bright"] { --wall-b: 1.4; --wall-s: .95; --glow-o: .75; --spot-o: .6; --shade-o: .45; --cglow-o: .55; --film-o: .45; }
body[data-light="dark"] {
  --wall-b: .42; --glow-o: .8; --spot-o: 1.6; --shade-o: 1; --cglow-o: 1.25; --film-o: 1.3;
  --tint: radial-gradient(ellipse 85% 75% at 50% 40%, rgba(0, 0, 0, 0) 40%, rgba(0, 0, 0, .7) 100%); --tint-blend: normal; --tint-o: 1;
}
body[data-light="warm"] {
  --wall-b: 1.08; --wall-s: 1.3; --spot-o: 1.3; --cglow-o: 1.35;
  --tint: linear-gradient(rgba(255, 150, 60, 1), rgba(255, 120, 40, 1)); --tint-blend: soft-light; --tint-o: .28;
}
.plinth {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--plinth);
  background: linear-gradient(to bottom, rgba(0, 0, 0, .35), rgba(0, 0, 0, .7)), var(--tex-edge); background-size: auto, 760px auto;
}
.pillar {
  position: absolute; top: 0; bottom: 0; width: var(--pillar-w); z-index: 4;
  background: linear-gradient(to right, rgba(0, 0, 0, .45), rgba(255, 214, 160, .14) 45%, rgba(0, 0, 0, .4)), var(--tex-pillar);
  background-size: auto, auto 760px;
}
.pillar.left { left: 0; box-shadow: 6px 0 12px rgba(0, 0, 0, .55); }
.pillar.right { right: 0; box-shadow: -6px 0 12px rgba(0, 0, 0, .55); }

/* ---------- 缶 ---------- */
.can-layer { position: absolute; inset: 0; z-index: 2; }
.can {
  position: absolute; left: 0; top: 0; width: var(--can-w); height: var(--can-h);
  transition: transform .34s cubic-bezier(.2, .8, .2, 1);
  touch-action: pan-y; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  cursor: grab;
}
.no-anim .can { transition: none !important; }
.can-inner { position: relative; width: 100%; height: 100%; transform-origin: 50% 100%; transition: transform .2s ease, filter .2s ease; }
.can-img {
  position: relative; display: block; width: 100%; height: 100%; pointer-events: none;
  object-fit: fill;
  opacity: 0; transition: opacity .45s ease;
}
.can.ready .can-img { opacity: 1; }
.can:not(.ready) .can-inner::before {
  content: ""; position: absolute; inset: 4% 3% 2%; border-radius: 10% / 4%;
  background: linear-gradient(90deg, rgba(255, 255, 255, .03), rgba(255, 230, 190, .1) 30%, rgba(255, 255, 255, .03));
}
/* ---- 照明レイヤー（棚全体の演出。画像ごとの補正とは独立） ---- */
/* 背面の壁に落ちる柔らかい陰（缶の後ろの回り込み） */
.can-back {
  position: absolute; left: -22%; right: -22%; bottom: 0; height: calc(var(--sw, 60px) * 1.15); pointer-events: none;
  background: radial-gradient(ellipse 50% 72% at 50% 100%, rgba(10, 4, 0, .38), rgba(10, 4, 0, 0) 100%);
}
/* 接地影：缶と棚板が接する細く濃い陰（AO）＋ 周囲の柔らかい影 */
.can-shadow {
  /* 影の大きさは缶の「幅」から決める → 350ml と 500ml で影の形・濃さがそろう */
  position: absolute; left: -18%; right: -18%; bottom: calc(var(--sw, 60px) * -0.11); height: calc(var(--sw, 60px) * 0.27); pointer-events: none;
  background:
    radial-gradient(ellipse 36% 22% at 50% 46%, rgba(0, 0, 0, .92), rgba(0, 0, 0, 0) 100%),
    radial-gradient(ellipse 44% 38% at 50% 48%, rgba(0, 0, 0, .55), rgba(0, 0, 0, 0) 100%),
    radial-gradient(ellipse 50% 50% at 50% 52%, rgba(20, 8, 0, .3), rgba(0, 0, 0, 0) 100%);
  transition: transform .2s ease, opacity .2s ease;
}
/* 上からの間接光：缶の下に向かって光が落ちる（乗算）＋ 暖色の環境光 */
.can-shade, .can-glow {
  position: absolute; inset: 0; pointer-events: none;
  -webkit-mask-size: 100% 100%; mask-size: 100% 100%;
  -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
}
.can-shade {
  mix-blend-mode: multiply; opacity: var(--shade-o, 1); transition: opacity .45s ease;
  /* 上からの光が下へ弱まる ＋ 円柱の左右の回り込み（全缶共通の向き・強さ） */
  background:
    linear-gradient(to right, rgb(222, 208, 192) 0%, rgb(255, 255, 255) 20%, rgb(255, 255, 255) 72%, rgb(214, 198, 182) 100%),
    linear-gradient(to bottom, rgb(255, 244, 228) 0%, rgb(252, 238, 218) 35%, rgb(236, 216, 192) 75%, rgb(196, 168, 140) 100%);
  background-blend-mode: multiply;
}
/* ダウンライト直下の缶ほど、フタと肩が暖かく照らされる（--lit は位置から計算）。
 * ラベル全体に光を足すと霞んで見えるため、フタ〜肩の狭い範囲だけにとどめる */
.can-glow {
  mix-blend-mode: screen; opacity: calc(var(--lit, .6) * var(--cglow-o, 1)); transition: opacity .45s ease;
  background: radial-gradient(ellipse 80% 13% at 50% 0%, rgba(255, 200, 130, .42), rgba(255, 170, 90, .1) 60%, rgba(255, 160, 80, 0) 100%);
}
.can.pressing .can-inner { transform: scale(.97); }
.can.dragging { transition: none; z-index: 30; cursor: grabbing; }
.can.dragging .can-inner { transform: translateY(-9%) scale(1.13); filter: drop-shadow(0 16px 12px rgba(0, 0, 0, .6)); }
.can.dragging .can-shadow { opacity: .15; transform: translateY(70%) scale(1.4); }
.can.dragging .can-back { opacity: 0; }
.can.settling { z-index: 20; }
.can.to-backyard .can-inner { transform: translateY(-4%) scale(.8); opacity: .75; }
.can.flash .can-inner { animation: canflash 1.4s ease; }
@keyframes canflash { 0%, 100% { filter: none; } 25%, 60% { filter: drop-shadow(0 0 10px rgba(255, 210, 130, .95)) brightness(1.08); } }

.vine { position: absolute; top: 0; z-index: 5; pointer-events: none; }
.vine svg { display: block; }

.tier-labels { position: absolute; inset: 0; pointer-events: none; z-index: 6; }
.tier-count {
  position: absolute; right: 18px; font-size: 11px; color: rgba(232, 183, 101, .82); letter-spacing: .06em;
  text-shadow: 0 1px 3px rgba(0, 0, 0, .9); transition: transform .2s, color .2s;
}
.tier-count[hidden] { display: none; }
.tier-count b { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tier-count.hot { color: #ffd38a; transform: scale(1.15); }
.edge-shade { position: absolute; top: 0; bottom: 0; width: 14px; pointer-events: none; z-index: 6; }
.edge-shade.left { left: 0; background: linear-gradient(to right, rgba(0, 0, 0, .45), transparent); }
.edge-shade.right { right: 0; background: linear-gradient(to left, rgba(0, 0, 0, .45), transparent); }

/* ---------- タブバー ---------- */
.tabbar {
  position: relative; z-index: 10;
  display: grid; grid-template-columns: 1fr 1fr 96px; align-items: center;
  height: calc(62px + var(--safe-b)); padding-bottom: var(--safe-b);
  background: linear-gradient(#1c120b, #120b06);
  box-shadow: 0 -1px 0 rgba(232, 183, 101, .12), 0 -6px 16px rgba(0, 0, 0, .5);
}
.tab { position: relative; display: grid; justify-items: center; gap: 3px; color: #9b8a76; font-size: 11px; letter-spacing: .06em; }
.tab svg { width: 24px; height: 24px; }
.tab.active { color: var(--gold); }
.tab.drop-hot { color: #ffe0a6; }
.tab.drop-hot::before { content: ""; position: absolute; inset: -8px 10%; border-radius: 14px; background: rgba(232, 183, 101, .18); box-shadow: inset 0 0 0 1.5px rgba(255, 214, 150, .7); }
.is-dragging .tab#tab-backyard { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { color: #f3cf8f; } }
.badge {
  position: absolute; top: -4px; left: calc(50% + 8px); min-width: 18px; height: 18px; padding: 0 5px;
  border-radius: 9px; background: #5a3b1f; color: #ffe2b0; font-size: 10px; font-style: normal; line-height: 18px; text-align: center;
}
.fab {
  position: absolute; right: 18px; top: -24px; width: 60px; height: 60px; border-radius: 50%;
  display: grid; place-items: center; color: #fff;
  background: radial-gradient(circle at 35% 30%, #f6d08e, #d99b47 55%, #b07429);
  box-shadow: 0 8px 18px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .45);
}
.fab svg { width: 28px; height: 28px; }
.fab:active { transform: scale(.95); }

/* ---------- 詳細シート ---------- */
#modal-root { position: fixed; inset: 0; z-index: 100; display: none; }
#modal-root.open { display: block; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(8, 4, 1, .62); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); opacity: 0; transition: opacity .25s; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 560px;
  padding: 8px 20px calc(18px + var(--safe-b));
  background: linear-gradient(#2b1b10, #1b110a); border-radius: 22px 22px 0 0;
  box-shadow: 0 -10px 40px rgba(0, 0, 0, .6), inset 0 1px 0 rgba(255, 220, 170, .12);
  transform: translateY(105%); transition: transform .3s cubic-bezier(.2, .8, .2, 1);
}
.visible .sheet-backdrop { opacity: 1; }
.visible .sheet { transform: none; }
.sheet-grip { width: 40px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .18); margin: 2px auto 12px; }
.sheet-body { display: grid; grid-template-columns: 50% 1fr; gap: 14px; align-items: center; }
.sheet-can { position: relative; padding: 14px 4px 12px; }
.sheet-spot { pointer-events: none; position: absolute; inset: -10% -20% 0; background: radial-gradient(ellipse 50% 60% at 50% 30%, rgba(255, 196, 120, .35), transparent 70%); }
.sheet-can img { position: relative; display: block; width: 100%; max-width: 230px; max-height: 46vh; object-fit: contain; margin: 0 auto; filter: drop-shadow(0 6px 8px rgba(0, 0, 0, .5)); }
.sheet-can-shadow { position: relative; height: 10px; margin: -6px 12% 0; background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(0, 0, 0, .7), transparent); }
.sheet-brewery { font-size: 12px; color: var(--ink-2); letter-spacing: .06em; }
.sheet-name { margin: 4px 0 2px; font-family: "Hiragino Mincho ProN", Georgia, "Noto Serif CJK JP", serif; font-size: 24px; font-weight: 600; line-height: 1.25; color: #fbeedb; }
.sheet-style { font-size: 12px; color: var(--gold); letter-spacing: .08em; }
.sheet-meta { margin: 16px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: 14px; }
.sheet-meta dt { color: #a98c66; font-size: 12px; padding-top: 2px; }
.sheet-meta dd { margin: 0; color: #f1e3cd; line-height: 1.55; }
.sheet-meta dd.muted { color: #7d6a55; }
.sheet-actions { display: grid; grid-template-columns: 1fr 1.3fr 1fr; gap: 8px; margin-top: 18px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 44px; border-radius: 12px; font-size: 13px; font-weight: 600; letter-spacing: .03em;
}
.btn.ghost { background: rgba(255, 230, 190, .07); color: #f0dfc5; box-shadow: inset 0 0 0 1px rgba(255, 220, 170, .14); }
.btn.danger { background: rgba(220, 80, 60, .1); color: #ff9a85; box-shadow: inset 0 0 0 1px rgba(255, 120, 100, .25); }
.btn.danger.solid { background: #c4432f; color: #fff; box-shadow: none; }
.btn:active { transform: scale(.97); }

.confirm { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(0, 0, 0, .55); opacity: 0; transition: opacity .2s; z-index: 2; }
.confirm.visible { opacity: 1; }
.confirm-card { width: min(330px, 86vw); padding: 22px 20px 16px; border-radius: 18px; background: #2a1a10; box-shadow: 0 20px 50px rgba(0, 0, 0, .6), inset 0 1px 0 rgba(255, 220, 170, .1); }
.confirm-card h3 { margin: 0 0 8px; font-size: 17px; }
.confirm-card p { margin: 0 0 18px; font-size: 13px; line-height: 1.6; color: #cdb797; }
.confirm-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

#toast {
  position: fixed; left: 50%; bottom: calc(96px + var(--safe-b)); z-index: 200; transform: translate(-50%, 10px);
  max-width: 88vw; padding: 10px 16px; border-radius: 999px; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  background: rgba(30, 18, 10, .95); color: #f6e6cc; box-shadow: 0 6px 20px rgba(0, 0, 0, .5), inset 0 0 0 1px rgba(232, 183, 101, .25);
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- ボタン共通 ---------- */
.btn.primary { background: linear-gradient(#e9b765, #c98d3c); color: #2a1406; box-shadow: 0 4px 12px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .4); }
.btn.primary:disabled { opacity: .6; }
.btn.small { height: 34px; font-size: 12px; padding: 0 12px; }
.btn.wide { width: 100%; margin-top: 8px; }

/* ---------- バックヤード ---------- */
.backyard {
  background:
    radial-gradient(ellipse 80% 50% at 50% 0%, rgba(255, 180, 100, .16), transparent 70%),
    linear-gradient(rgba(0, 0, 0, .55), rgba(0, 0, 0, .7)), var(--tex-wall);
  background-size: auto, auto, 900px auto;
}
.by-scroll { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px 0 110px; }
.by-hint { margin: 4px 16px 12px; font-size: 11.5px; line-height: 1.6; color: #b99a72; }
.by-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); row-gap: 22px; padding: 0 8px; }
.by-item { position: relative; display: grid; justify-items: center; padding: 6px 4px 0; text-align: center; }
.by-item::after { /* 棚板 */
  content: ""; position: absolute; left: -1px; right: -1px; top: calc(6px + var(--by-can-h, 128px) - 4px); height: 12px;
  background: linear-gradient(to bottom, rgba(255, 220, 170, .35), rgba(0, 0, 0, 0) 25%, rgba(0, 0, 0, .45)), var(--tex-edge);
  background-size: auto, 500px auto; box-shadow: 0 6px 10px rgba(0, 0, 0, .5);
}
.by-can { position: relative; z-index: 1; display: block; width: 70%; height: var(--by-can-h, 128px); }

/* data.js */
/* データ層（現在：localStorage。STEP 3 で Supabase 実装に差し替える）
 * 形は DB 設計（can_entries / placements）に合わせている。
 * 初期データは、撮影いただいた実物の缶のみ（ダミーなし）。 */
(function (NS) {
  'use strict';

  const STORAGE_KEY = 'canshelf.v5';
  // v5: Google Drive の全コレクション(124本)に入れ替え。旧データは読み込まずに破棄する
  const OLD_KEYS = [];
  const DROP_KEYS = ['canshelf.v3', 'canshelf.v4'];

  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function localToday() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  // 初期データは src/js/seeds.js（tools/seed_build.py が生成）。
  // 切り抜きは未補正のまま保持し、補正パラメータ（tone）を当てて表示する。
  const IMAGE_FIELDS = ['cutoutImagePath', 'cutoutAspect', 'sizeClass', 'tone'];
  function seedEntry(r, now, today) {
    return {
      id: 'u' + r.key, userId: 'local', beerName: r.name, brewery: r.brewery, drankOn: today, review: '',
      originalImagePath: 'seed-src:' + r.key, cutoutImagePath: 'seed:' + r.key,
      cutoutAspect: r.aspect, sizeClass: r.sizeClass, tone: r.tone, createdAt: now,
      style: r.style || '', country: r.country || '', volumeMl: r.volume || null,
    };
  }

  function makeInitial() {
    const today = localToday();
    const now = new Date().toISOString();
    const cans = (NS.SEEDS || []).map((r) => seedEntry(r, now, today));
    // 全部マイシェルフへ（段への振り分けは表示時に 1段あたりの本数で決まる）。バックヤードは空
    return { cans, tiers: [cans.map((c) => c.id)], backyard: [], layoutN: 0 };
  }

  /* 初期データの画像処理を改善したときは、ユーザーの編集（名称・日付・レビュー・並び）を残したまま
   * 画像関連の項目だけを最新の処理結果に差し替える */
  function refreshSeedImages(state) {
    const byKey = new Map((NS.SEEDS || []).map((r) => [r.key, r]));
    for (const c of state.cans) {
      const r = c.id.startsWith('u') && byKey.get(c.id.slice(1));
      if (!r) continue;
      c.cutoutImagePath = 'seed:' + r.key; c.originalImagePath = 'seed-src:' + r.key;
      c.cutoutAspect = r.aspect; c.sizeClass = r.sizeClass; c.tone = r.tone;
      // 種別・国名・容量：ユーザーがまだ入力していない項目だけ埋める
      if (c.style == null) c.style = r.style || '';
      if (c.country == null) c.country = r.country || '';
      if (c.volumeMl === undefined) c.volumeMl = r.volume || null;
      delete c.toned;
    }
    return state;
  }

  function load() {
    try {
      if (DROP_KEYS.some((k) => localStorage.getItem(k) != null)) {
        for (const k of DROP_KEYS) localStorage.removeItem(k);
        try { NS.images && NS.images.clearAll && NS.images.clearAll(); } catch (e) { /* ignore */ }
      }
      for (const key of [STORAGE_KEY, ...OLD_KEYS]) {
        const raw = localStorage.getItem(key);
        if (!raw) continue;
        const s = JSON.parse(raw);
        if (s && Array.isArray(s.cans) && Array.isArray(s.tiers)) return refreshSeedImages(s);
      }
    } catch (e) { /* storage unavailable */ }
    return makeInitial();
  }

  function save(state) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  }

  function reset() {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* ignore */ }
    return makeInitial();
  }

  /* placements 形式（DB 保存用）に変換 */
  function toPlacements(state) {
    const rows = [];
    state.tiers.forEach((ids, t) => ids.forEach((id, i) =>
      rows.push({ entryId: id, location: 'shelf', tier: t + 1, position: i })));
    state.backyard.forEach((id, i) => rows.push({ entryId: id, location: 'backyard', tier: null, position: i }));
    return rows;
  }

  /* ---------- 棚の段割り ----------
   * 1段あたりの本数（N）は「少なめ／標準／多め」と画面幅で決まる。
   * 各段は最大 N 本。あふれた缶は次の段の先頭へ送る（缶を抜いても、他の段の缶は動かさない）。
   * N が変わったときだけ、並び順を保ったまま全体を N 本ずつに詰め直す。 */
  const DENSITY = { few: [4, 7, 10], std: [6, 10, 15], many: [8, 13, 20] };   // [スマホ, タブレット, PC]
  function perTier(width, density = NS.settings.density) {
    const d = DENSITY[density] || DENSITY.std;
    return width < 640 ? d[0] : width < 1024 ? d[1] : d[2];
  }
  function reflow(state, N) {
    let rows;
    if (state.layoutN !== N) {
      const flat = state.tiers.flat();
      rows = [];
      for (let i = 0; i < flat.length; i += N) rows.push(flat.slice(i, i + N));
      state.layoutN = N;
    } else {
      rows = []; let carry = [];
      for (const r of state.tiers) {
        const row = carry.concat(r);
        carry = row.slice(N); rows.push(row.slice(0, N));
      }
      while (carry.length) { rows.push(carry.slice(0, N)); carry = carry.slice(N); }
    }
    while (rows.length > 1 && !rows[rows.length - 1].length) rows.pop();   // 末尾の空き段は詰める
    if (!rows.length) rows.push([]);
    const changed = JSON.stringify(rows) !== JSON.stringify(state.tiers);
    state.tiers = rows;
    return changed;
  }

  /* 表示設定（端末ごと） */
  const SETTINGS_KEY = 'canshelf.settings';
  const BRIGHTNESS_DEFAULT = 1.3;
  NS.settings = { normalize: true, lighting: true, brightness: BRIGHTNESS_DEFAULT, density: 'std', light: 'standard', v: 2 };
  try {
    const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
    // v2：缶の明るさの初期値を引き上げた（1.15 → 1.3）。以前の保存値は新しい初期値に置き換える
    if (saved.v !== 2) { delete saved.brightness; saved.v = 2; }
    Object.assign(NS.settings, saved);
  } catch (e) { /* ignore */ }
  function saveSettings() { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(NS.settings)); } catch (e) { /* ignore */ } }

  NS.data = { IMAGE_FIELDS, saveSettings, perTier, reflow, load, save, reset, toPlacements, rng, localToday };
})(window.CanShelf = window.CanShelf || {});

/* canArt.js */
/* 仮の缶画像（背景透過）を Canvas で生成する。

    const c = [];
    for (let j = 0; j < k; j++) { const i = Math.floor((j + 0.5) / k * n) * 3; c.push([samples[i], samples[i + 1], samples[i + 2]]); }
    const assign = new Uint8Array(n);
    for (let it = 0; it < iters; it++) {
      for (let i = 0; i < n; i++) {
        let best = 0, bd = 1e9;
        for (let j = 0; j < k; j++) {
          const dr = samples[i * 3] - c[j][0], dg = samples[i * 3 + 1] - c[j][1], db = samples[i * 3 + 2] - c[j][2];
          const d = dr * dr + dg * dg + db * db;
          if (d < bd) { bd = d; best = j; }
        }
        assign[i] = best;
      }
      const sum = Array.from({ length: k }, () => [0, 0, 0, 0]);
      for (let i = 0; i < n; i++) { const s = sum[assign[i]]; s[0] += samples[i * 3]; s[1] += samples[i * 3 + 1]; s[2] += samples[i * 3 + 2]; s[3]++; }
      sum.forEach((s, j) => { if (s[3]) c[j] = [s[0] / s[3], s[1] / s[3], s[2] / s[3]]; });
    }
    return c;
  }

  /** 自動検出。返り値は比率: { cx, w, top, bot }（cx,w は画像幅基準、top,bot は高さ基準） */
  function detect(src) {
    const cv = toCanvas(src, 560);
    const W = cv.width, H = cv.height;
    const px = cv.getContext('2d').getImageData(0, 0, W, H).data;

    // 背景サンプル：上端・左右の帯・下端
    const smp = [];
    const push = (x, y) => { const i = (y * W + x) * 4; smp.push(px[i], px[i + 1], px[i + 2]); };
    for (let y = 0; y < H; y += 3) for (let x = 0; x < W; x += 3) {
      if (y < H * 0.1 || y > H * 0.95 || x < W * 0.12 || x > W * 0.88) push(x, y);
    }
    const cents = kmeans(smp, 6, 8);
    const dist = new Float32Array(W * H);
    for (let i = 0, p = 0; i < W * H; i++, p += 4) {
      let bd = 1e9;
      for (const c of cents) {
        const dr = px[p] - c[0], dg = px[p + 1] - c[1], db = px[p + 2] - c[2];
        const d = dr * dr + dg * dg + db * db;
        if (d < bd) bd = d;
      }
      dist[i] = Math.sqrt(bd);
    }
    // しきい値：背景サンプルの距離分布の上位から
    const bdists = [];
    for (let y = 0; y < H; y += 2) for (let x = 0; x < W; x += 2) {
      if (y < H * 0.1 || x < W * 0.1 || x > W * 0.9) bdists.push(dist[y * W + x]);
    }
    bdists.sort((a, b) => a - b);
    const T = Math.max(24, bdists[Math.floor(bdists.length * 0.985)] * 1.15);

    let fg = new Uint8Array(W * H);
    for (let i = 0; i < W * H; i++) fg[i] = dist[i] > T ? 1 : 0;
    fg = morph(morph(fg, W, H, 2, true), W, H, 2, false);  // close
    fg = morph(morph(fg, W, H, 1, false), W, H, 1, true);  // open

    // 中央寄りで大きい連結成分を選ぶ
    const label = new Int32Array(W * H).fill(-1);
    let best = null;
    const stack = [];
    for (let s = 0; s < W * H; s++) {
      if (!fg[s] || label[s] >= 0) continue;
      const id = s; let area = 0, sx = 0, minX = W, maxX = 0, minY = H, maxY = 0;
      stack.push(s); label[s] = id;
      while (stack.length) {
        const q = stack.pop(); const x = q % W, y = (q / W) | 0;
        area++; sx += x;
        if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y;
        const nb = [q - 1, q + 1, q - W, q + W];
        for (let k = 0; k < 4; k++) {
          const r = nb[k];
          if (r < 0 || r >= W * H || label[r] >= 0 || !fg[r]) continue;
          if ((k === 0 && x === 0) || (k === 1 && x === W - 1)) continue;
          label[r] = id; stack.push(r);
        }
      }
      const cxN = sx / area / W;
      const score = area * Math.max(0.05, 1 - Math.abs(cxN - 0.5) * 2.2);
      if (!best || score > best.score) best = { id, score, minX, maxX, minY, maxY };
    }
    if (!best) return fallback();

    // 行ごとの左右端
    const rows = [];
    for (let y = best.minY; y <= best.maxY; y++) {
      let l = -1, r = -1;
      for (let x = best.minX; x <= best.maxX; x++) if (label[y * W + x] === best.id) { if (l < 0) l = x; r = x; }
      rows.push({ y, l, r, w: l < 0 ? 0 : r - l + 1 });
    }
    const h = best.maxY - best.minY + 1;
    const mid = rows.filter((r) => r.y > best.minY + h * 0.35 && r.y < best.minY + h * 0.75 && r.w > 0);
    if (!mid.length) return fallback();
    const med = (a) => { const s = a.slice().sort((p, q) => p - q); return s[Math.floor(s.length / 2)]; };
    let bw = med(mid.map((r) => r.w));
    let cx = med(mid.map((r) => (r.l + r.r) / 2));

    // 缶の左右の輪郭（縦に長く続くエッジ）で幅を補正。ラベルが背景色に近い場合の欠けを防ぐ
    const y0 = mid[0].y, y1 = mid[mid.length - 1].y;
    const colScore = (x) => {
      let s = 0;
      for (let y = y0; y <= y1; y += 2) {
        const i = (y * W + x) * 4, j = i + 8; // 2px 横の差
        s += Math.abs(px[i] - px[j]) + Math.abs(px[i + 1] - px[j + 1]) + Math.abs(px[i + 2] - px[j + 2]);
      }
      return s;
    };
    const argmax = (a, b) => { let bx = -1, bs = -1; for (let x = Math.max(1, a | 0); x <= Math.min(W - 3, b | 0); x++) { const v = colScore(x); if (v > bs) { bs = v; bx = x; } } return bx; };
    const L = argmax(cx - bw * 0.72, cx - bw * 0.4) + 1;
    const R = argmax(cx + bw * 0.4 - 2, cx + bw * 0.72 - 2) + 1;
    if (L > 0 && R > L && (R - L) > bw * 0.92 && (R - L) < bw * 1.3) { bw = R - L; cx = (L + R) / 2; }

    // 上端：プルタブを除き、幅が十分ある最初の行
    let top = best.minY;
    for (const r of rows) { if (r.w >= bw * 0.55) { top = r.y; break; } }

    // 下端：棚に落ちた影を除くため、中央帯が無彩色（アルミの底）の最下行
    let bot = best.maxY;
    const limit = top + (best.maxY - top) * 0.75;
    for (let y = best.maxY; y > limit; y--) {
      let n = 0, ok = 0;
      for (let x = Math.round(cx - bw * 0.3); x <= cx + bw * 0.3; x++) {
        const i = (y * W + x) * 4;
        const mx = Math.max(px[i], px[i + 1], px[i + 2]), mn = Math.min(px[i], px[i + 1], px[i + 2]);
        const sat = mx ? (mx - mn) / mx : 0;
        n++; if (sat < 0.22 || mx < 55) ok++;
      }
      if (ok / n > 0.5) { bot = y + 1; break; }
    }
    return { cx: cx / W, w: bw / W, top: top / H, bot: bot / H, auto: true };
  }

  function fallback() { return { cx: 0.5, w: 0.2, top: 0.3, bot: 0.8, auto: false }; }

  function morph(src, W, H, r, dilate) {
    const out = new Uint8Array(W * H);
    const tmp = new Uint8Array(W * H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      let v = dilate ? 0 : 1;
      for (let k = -r; k <= r; k++) {
        const xx = Math.min(W - 1, Math.max(0, x + k)); const s = src[y * W + xx];
        if (dilate ? s : !s) { v = dilate ? 1 : 0; break; }
      }
      tmp[y * W + x] = v;
    }
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      let v = dilate ? 0 : 1;
      for (let k = -r; k <= r; k++) {
        const yy = Math.min(H - 1, Math.max(0, y + k)); const s = tmp[yy * W + x];
        if (dilate ? s : !s) { v = dilate ? 1 : 0; break; }
      }
      out[y * W + x] = v;
    }
    return out;
  }

  /** 画像ピクセル座標での缶シルエット */
  function geom(p, iw, ih) {
    const w = p.w * iw, cx = p.cx * iw, top = p.top * ih, bot = p.bot * ih;
    return { cx, w, top, bot, L: cx - w / 2, R: cx + w / 2 };
  }
  function silhouette(ctx, g, inset = 0) {
    const w = g.w - inset * 2, cx = g.cx, top = g.top + inset, bot = g.bot - inset;
    const L = cx - w / 2, R = cx + w / 2;
    const ryT = SHAPE.ryTop * g.w, ryB = SHAPE.ryBot * g.w;
    const nw = SHAPE.neckW * w / 2, neckY = top + ryT + SHAPE.neckH * g.w;
    const yb = bot - ryB - SHAPE.lift * g.w, bw = SHAPE.baseW * w / 2, round = SHAPE.round * g.w;
    ctx.beginPath();
    ctx.moveTo(cx - nw, top + ryT);
    ctx.ellipse(cx, top + ryT, nw, ryT, 0, Math.PI, Math.PI * 2);
    ctx.bezierCurveTo(cx + nw, top + ryT + (neckY - top - ryT) * 0.45, R, neckY - (neckY - top - ryT) * 0.4, R, neckY);
    ctx.lineTo(R, yb - round);
    ctx.quadraticCurveTo(R, yb, cx + bw, yb);
    ctx.ellipse(cx, yb, bw, ryB, 0, 0, Math.PI);
    ctx.quadraticCurveTo(L, yb, L, yb - round);
    ctx.lineTo(L, neckY);
    ctx.bezierCurveTo(L, neckY - (neckY - top - ryT) * 0.4, cx - nw, top + ryT + (neckY - top - ryT) * 0.45, cx - nw, top + ryT);
    ctx.closePath();
  }

  /* ---------- 中央の被写体（缶）の検出：背景が複雑な写真向け ----------
   * 画面中央の色の分布を「缶」、画面の縁の色の分布を「背景」として覚え、缶らしい色の領域のうち
   * 中央につながる部分を取り出す。缶の形（縦長の円柱）に当てはめ、数回くり返して精度を上げる。 */
  const HB = 16, SB = 6, VB = 5, NB = HB * SB * VB;
  function binOf(r, g, b) {
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
    let hh = 0;
    if (d > 0) { hh = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; hh *= 60; if (hh < 0) hh += 360; }
    const sv = mx ? d / mx : 0;
    return ((Math.min(HB - 1, (hh / 360 * HB) | 0) * SB + Math.min(SB - 1, (sv * SB) | 0)) * VB) + Math.min(VB - 1, (mx / 256 * VB) | 0);
  }
  function detectCenter(src) {
    const cv = toCanvas(src, 520), W = cv.width, H = cv.height;
    const d = cv.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, W, H).data;
    const idx = new Uint16Array(W * H);
    for (let i = 0, p = 0; i < W * H; i++, p += 4) idx[i] = binOf(d[p], d[p + 1], d[p + 2]);
    let box = null;   // { cx, w, top, bot }（ピクセル）
    let comp = null;
    for (let it = 0; it < 3; it++) {
      const fh = new Float32Array(NB).fill(0.5), bh = new Float32Array(NB).fill(0.5);
      for (let y = 0; y < H; y += 2) for (let x = 0; x < W; x += 2) {
        const b = idx[y * W + x], border = x < W * 0.07 || x > W * 0.93 || y < H * 0.05 || y > H * 0.97;
        if (!box) {
          if (Math.abs(x - W / 2) < W * 0.07 && y > H * 0.38 && y < H * 0.68) fh[b] += 1;
          else if (border) bh[b] += 1;
        } else {
          const ax = Math.abs(x - box.cx), ch = box.bot - box.top;
          if (ax < box.w * 0.36 && y > box.top + ch * 0.12 && y < box.top + ch * 0.92) fh[b] += 1;
          else if (border || (ax > box.w * 0.66 && ax < box.w * 1.8 && y > box.top - ch * 0.1 && y < box.bot + ch * 0.15)) bh[b] += 1;
        }
      }
      let tf = 0, tb = 0; for (let i = 0; i < NB; i++) { tf += fh[i]; tb += bh[i]; }
      const pr = new Float32Array(NB); for (let i = 0; i < NB; i++) { const a = fh[i] / tf, b = bh[i] / tb; pr[i] = a / (a + b); }
      // 確率マップをならす（横→縦の箱ぼかし）
      const P = new Float32Array(W * H), Q = new Float32Array(W * H), R = 3;
      for (let i = 0; i < W * H; i++) P[i] = pr[idx[i]];
      for (let y = 0; y < H; y++) { let acc = 0; for (let x = -R; x < W + R; x++) { if (x + R < W) acc += P[y * W + Math.min(W - 1, x + R)]; if (x - R - 1 >= 0) acc -= P[y * W + x - R - 1]; if (x >= 0 && x < W) Q[y * W + x] = acc / (2 * R + 1); } }
      for (let x = 0; x < W; x++) { let acc = 0; for (let y = -R; y < H + R; y++) { if (y + R < H) acc += Q[Math.min(H - 1, y + R) * W + x]; if (y - R - 1 >= 0) acc -= Q[(y - R - 1) * W + x]; if (y >= 0 && y < H) P[y * W + x] = acc / (2 * R + 1); } }
      // 中央につながる「缶らしい」領域
      const m = new Uint8Array(W * H); for (let i = 0; i < W * H; i++) m[i] = P[i] > 0.5 ? 1 : 0;
      let seed = -1, bd = 1e9;
      const scx = box ? box.cx : W / 2, scy = box ? (box.top + box.bot) / 2 : H * 0.55;
      for (let y = Math.round(scy - H * 0.12); y < scy + H * 0.12; y += 2) for (let x = Math.round(scx - W * 0.1); x < scx + W * 0.1; x += 2) {
        if (x < 0 || y < 0 || x >= W || y >= H || !m[y * W + x]) continue;
        const dd = (x - scx) ** 2 + (y - scy) ** 2; if (dd < bd) { bd = dd; seed = y * W + x; }
      }
      if (seed < 0) break;
      comp = new Uint8Array(W * H); const st = [seed]; comp[seed] = 1;
      while (st.length) {
        const q = st.pop(), x = q % W, y = (q / W) | 0;
        if (x > 0 && m[q - 1] && !comp[q - 1]) { comp[q - 1] = 1; st.push(q - 1); }
        if (x < W - 1 && m[q + 1] && !comp[q + 1]) { comp[q + 1] = 1; st.push(q + 1); }
        if (y > 0 && m[q - W] && !comp[q - W]) { comp[q - W] = 1; st.push(q - W); }
        if (y < H - 1 && m[q + W] && !comp[q + W]) { comp[q + W] = 1; st.push(q + W); }
      }
      // 行ごとの幅 → 胴の幅と中心 → 上下端
      const rows = [];
      for (let y = 0; y < H; y++) { let l = -1, r = -1; for (let x = 0; x < W; x++) if (comp[y * W + x]) { if (l < 0) l = x; r = x; } if (l >= 0) rows.push([y, l, r]); }
      if (rows.length < 20) break;
      const y0 = rows[0][0], y1 = rows[rows.length - 1][0], hgt = y1 - y0;
      const mid = rows.filter((r) => r[0] > y0 + hgt * 0.3 && r[0] < y0 + hgt * 0.75);
      if (!mid.length) break;
      const med = (a) => { const s2 = a.slice().sort((p, q) => p - q); return s2[s2.length >> 1]; };
      const w = med(mid.map((r) => r[2] - r[1] + 1)), cx = med(mid.map((r) => (r[1] + r[2]) / 2));
      const ok = rows.filter((r) => r[2] - r[1] + 1 >= w * 0.6 && Math.abs((r[1] + r[2]) / 2 - cx) < w * 0.25);
      if (!ok.length) break;
      box = { cx, w, top: ok[0][0], bot: ok[ok.length - 1][0] + 1 };
    }
    if (!box) return null;
    return { cx: box.cx / W, w: box.w / W, top: box.top / H, bot: box.bot / H, auto: true, by: 'center' };
  }

  /** 結果が缶として自然か（縦横比・大きさ・位置） */
  function plausible(p, iw, ih) {
    if (!p) return false;
    const asp = p.w * iw / ((p.bot - p.top) * ih);
    return asp > 0.33 && asp < 0.72 && p.w > 0.06 && p.w < 0.92 && (p.bot - p.top) > 0.12 && Math.abs(p.cx - 0.5) < 0.32;
  }
  /** 縁の強さ（缶の左右の縦の輪郭が、胴の上・中・下で続いているか）で候補を比べる */
  function edgeScore(src, p) {
    const cv = toCanvas(src, 520), W = cv.width, H = cv.height;
    const d = cv.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, W, H).data;
    const L = (x, y) => { const i = (y * W + x) * 4; return d[i] * 0.3 + d[i + 1] * 0.59 + d[i + 2] * 0.11; };
    const g = geom(p, W, H); let sc = 0;
    for (const [a, b] of [[0.25, 0.45], [0.45, 0.65], [0.65, 0.85]]) {
      let best = 0;
      for (const ex of [g.L, g.R]) {
        let m = 0;
        for (let dx = -3; dx <= 3; dx++) {
          const x = Math.round(ex + dx); if (x < 2 || x > W - 3) continue;
          let t = 0, n = 0; for (let y = Math.round(g.top + (g.bot - g.top) * a); y < g.top + (g.bot - g.top) * b; y += 2) { t += Math.abs(L(x + 2, y) - L(x - 2, y)); n++; }
          m = Math.max(m, n ? t / n : 0);
        }
        best += m;
      }
      sc += Math.min(best, 400);
    }
    return sc;
  }
  /** 総合：無地の壁向けの検出と、中央の被写体の検出を両方試し、缶らしい方を採る。どちらもだめなら中央に枠 */
  function detectBest(src) {
    const iw = src.naturalWidth || src.width, ih = src.naturalHeight || src.height;
    const cands = [];
    try { const a = detect(src); if (a.auto && plausible(a, iw, ih)) cands.push(a); } catch (e) { /* ignore */ }
    try { const b = detectCenter(src); if (plausible(b, iw, ih)) cands.push(b); } catch (e) { /* ignore */ }
    if (!cands.length) return { ...centerGuess(iw, ih), auto: false };
    if (cands.length === 1) return cands[0];
    // 白い缶×白い壁などでは、中央の検出がラベルの絵柄だけを拾って小さくなりがち。
    // 両方が缶らしいときは、縁がはっきりしている限り大きい方（缶全体）を採る
    const sc = cands.map((c) => ({ c, s: edgeScore(src, c), a: c.w * (c.bot - c.top) })).sort((x, y) => y.a - x.a);
    const big = sc[0].c, small = sc[1].c;
    const inside = Math.abs(small.cx - big.cx) < big.w / 2 && small.top >= big.top - 0.02 && small.bot <= big.bot + 0.02;
    if (inside) return big;                         // 小さい方が大きい方の中に収まる＝ラベルの一部だけを拾った
    return sc[0].s >= sc[1].s * 0.6 ? big : small;
  }
  /** どうしても見つからないとき：中央に 350ml 缶の比率の枠 */
  function centerGuess(iw, ih) {
    const hh = 0.5, w = hh * ih * 0.54 / iw;
    return { cx: 0.5, w: Math.min(0.6, w), top: 0.3, bot: 0.3 + hh, angle: 0 };
  }

  /* ---------- 傾き（STEP1-3-4） ----------
   * 缶の左右の輪郭（縦に長いエッジ）を行ごとに探し、直線を当てはめて中心軸の傾きを推定する。
   * 左右の傾きが一致しない（＝斜め撮影やパース）場合は自動補正しない（手動スライダーで調整）。
   * 返り値：度（時計回りが正。画像を -angle 回転すると軸が垂直になる） */
  function estimateTilt(src, p) {
    const sw = src.naturalWidth || src.width, sh = src.naturalHeight || src.height;
    const g0 = geom(p, sw, sh);
    const k = Math.min(1, 700 / (g0.bot - g0.top));
    const W = Math.round(sw * k), H = Math.round(sh * k);
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(src, 0, 0, W, H);
    const d = ctx.getImageData(0, 0, W, H).data;
    const g = geom(p, W, H);
    const lum = (x, y) => { const i = (y * W + x) * 4; return d[i] * 0.3 + d[i + 1] * 0.59 + d[i + 2] * 0.11; };
    const win = Math.max(3, Math.round(g.w * 0.07));
    const fit = (side) => {
      const xs = [], ys = [];
      const x0 = side < 0 ? g.L : g.R;
      for (let y = Math.round(g.top + (g.bot - g.top) * 0.25); y < g.bot - (g.bot - g.top) * 0.12; y += 2) {
        let best = -1, bx = 0;
        for (let x = Math.max(2, Math.round(x0 - win)); x <= Math.min(W - 3, Math.round(x0 + win)); x++) {
          const v = Math.abs(lum(x + 1, y) + lum(x + 2, y) - lum(x - 1, y) - lum(x - 2, y));
          if (v > best) { best = v; bx = x; }
        }
        if (best > 40) { xs.push(bx); ys.push(y); }

    for (const [x, y] of pts) { const t = 1 - Math.cos(Math.asin(clamp((x - cx) / hw, -1, 1))); s1 += t; s2 += t * t; sy += y; sty += t * y; n++; }
    const e = (n * sty - s1 * sy) / (n * s2 - s1 * s1 || 1);
    const yb = (sy - e * s1) / n;
    return { cx, hw, top, bot, eBot: clamp(e, 0, hw * 0.6), yb };
  }

  /* ---------- 円柱の展開表（透視投影）。f：取り込みの倍率（4K なら 2） ---------- */
  function makeCyl(geo, W, H, f, eye) {
    const F = 1.103 * Math.max(W, H);                 // iPhone の動画（手ぶれ補正あり）の画角に相当
    const t = geo.hw / F, rho = t / Math.sqrt(1 + t * t);
    const Rpx = F * rho / (1 - rho);
    // 楕円の短半径 e(y) は目線の高さ（e=0）からの距離に比例：e = k(y − yEye)
    const k = eye ? eye.k : rho, yEye = eye ? eye.yEye : geo.yb - geo.eBot / k;
    // 輪郭（θ=±90°）の行 y と、正面（θ=0）の行 h の関係は y = h − e(h)。
    // 展開図は胴のまっすぐな部分だけ：上は肩の少し下から（缶をつまむ指が入らないように）、下は底のすぼまりの手前まで
    const front = (y) => (y - k * yEye) / (1 - k);
    // 位置合わせ用は下を広めに切る（机が入ると「動いていない」方に引っぱられる）。合成用は底の近くまで残し、机は合成時に動きで見分けて外す
    const h0 = Math.round(front(geo.top) + geo.hw * 0.08), h1 = Math.round(front(geo.bot) - geo.hw * BOT_M);
    const h1r = Math.round(front(geo.bot) - geo.hw * 0.15);
    const nH = h1 - h0;
    // 2種類の展開：位置合わせ用（基準解像度・±TH_STRIP°）と、合成用（f 倍・±TH_KEEP°）
    const grid = (thDeg, g, hh = nH) => {
      const NS = Math.round(2 * Rpx * thDeg * Math.PI / 180) * g, NH = hh * g;
      const sx = new Float32Array(NS), cosT = new Float32Array(NS);
      for (let i = 0; i < NS; i++) {
        const th = (i - NS / 2) / g / Rpx;
        sx[i] = F * rho * Math.sin(th) / (1 - rho * Math.cos(th));
        cosT[i] = 1 - Math.cos(th);
      }
      return { NS, NH, f: g, sx, cosT };
    };
    return { F, rho, Rpx, k, yEye, h0, h1, nH, f, reg: grid(TH_STRIP, 1, h1r - h0), keep: grid(TH_KEEP, f) };
  }

  /* 1コマを展開。img は缶のまわりを f 倍で取り込んだ画像（基準座標 (x, y) → 画素 ((x−ox)·f, (y−oy)·f)）。
   * cx・scale は追跡した値（缶が動いても・遠ざかっても同じ尺度になる） */
  function unwrap(img, cyl, gr, cx, scale, out, ch = 4) {
    const { NS, NH, sx, cosT, f: g } = gr;
    const { h0, k, yEye } = cyl;
    const { data, W, H, ox, oy, f } = img;
    const yc = cyl.yEye;   // 缶が奥・手前に動いたときは、目線の高さ（地平線）を中心に縮む・広がる
    for (let r = 0; r < NH; r++) {
      const hy = yc + (h0 + r / g - yc) * scale;
      const e = k * (hy - yEye);
      for (let i = 0; i < NS; i++) {
        const x = (cx + sx[i] * scale - ox) * f, y = (hy - e * cosT[i] - oy) * f;
        const xi = x | 0, yi = y | 0, fx = x - xi, fy = y - yi;
        const o = (r * NS + i) * ch;
        if (xi < 0 || yi < 0 || xi >= W - 1 || yi >= H - 1) { if (ch === 4) out[o + 3] = 0; continue; }
        const p = (yi * W + xi) * 4, q = p + W * 4;
        for (let c = 0; c < 3; c++) {
          const a = data[p + c] + (data[p + 4 + c] - data[p + c]) * fx;
          const b = data[q + c] + (data[q + 4 + c] - data[q + c]) * fx;
          out[o + c] = a + (b - a) * fy;
        }
        if (ch === 4) out[o + 3] = 255;
      }
    }
    return out;
  }

  /* 位置合わせ用：展開した帯全体を半分の解像度の勾配画像にする。
   * テンプレートは基準コマの正面 ±TH_REG°、探す相手は新しいコマの帯全体（±TH_STRIP°）。 */
  function regImage(strip, cyl) {
    // 高解像度の帯（f 倍）を、元の基準解像度の半分（2f 画素ごと）に縮めて使う
    const { NS, NH } = cyl.reg, Rpx = cyl.Rpx, f = 1, st = 2;
    const W2 = Math.floor(NS / st), H2 = Math.floor(NH / st);
    const g = new Float32Array(W2 * H2);
    for (let y = 0; y < H2; y++) for (let x = 0; x < W2; x++) {
      let v = 0;
      for (let yy = 0; yy < f; yy++) for (let xx = 0; xx < f; xx++) {
        const o = ((y * st + yy) * NS + x * st + xx) * 4;
        v += strip[o] * 0.3 + strip[o + 1] * 0.59 + strip[o + 2] * 0.11;
      }
      g[y * W2 + x] = v / (f * f);
    }
    const d = new Float32Array(W2 * H2);
    for (let y = 1; y < H2 - 1; y++) for (let x = 1; x < W2 - 1; x++) {
      const i = y * W2 + x;
      d[i] = Math.abs(g[i + 1] - g[i - 1]) + Math.abs(g[i + W2] - g[i - W2]);
    }
    const half = Math.round(Rpx * TH_REG * Math.PI / 180 / 2);
    let sh = 0; for (let i = 0; i < d.length; i++) sh += d[i];
    return { d, W2, H2, t0: (W2 >> 1) - half, t1: (W2 >> 1) + half, sharp: sh / d.length };
  }
  /* 基準コマ a の正面の窓が、b のどこにあるか（半分の解像度で探して放物線で細かく）。
   * 戻り値 dx は元の解像度：b の中身は a に対して dx だけ横にずれている */
  function match(a, b, pred, range, dyR = 3, dyC = 0) {
    const { W2, H2 } = a;
    const x0 = a.t0, x1 = a.t1, y0 = 8, y1 = H2 - 8;
    const lim = Math.min(x0, W2 - x1) - 1;
    let best = Infinity, bx = 0, by = 0;
    const sc = new Map();
    const cost = (dx, dy) => {
      if (Math.abs(dx) > lim) return Infinity;
      const key = dx * 1000 + dy; if (sc.has(key)) return sc.get(key);
      let s = 0, n = 0;
      for (let y = y0; y < y1; y += 2) {
        const yb = y + dy; if (yb < 0 || yb >= H2) continue;
        const ra = y * W2, rb = yb * W2 + dx;
        for (let x = x0; x < x1; x++) { s += Math.abs(a.d[ra + x] - b.d[rb + x]); n++; }
      }
      const v = s / n; sc.set(key, v); return v;
    };
    const pc = clamp(Math.round(pred / 2), -lim, lim);
    for (let dx = pc - range; dx <= pc + range; dx++) for (let dy = dyC - dyR; dy <= dyC + dyR; dy++) {
      const v = cost(dx, dy); if (v < best) { best = v; bx = dx; by = dy; }
    }
    // 一致の確かさ：探した範囲の中央値と最良値の比（模様がはっきり一致しているほど大きい）
    const all = [...sc.values()].filter(isFinite).sort((p, q) => p - q);
    const ratio = all.length ? all[all.length >> 1] / Math.max(best, 1e-6) : 1;
    const para = (l, c, r) => (isFinite(l) && isFinite(r) ? clamp(0.5 * (l - r) / (l - 2 * c + r || 1e-6), -0.5, 0.5) : 0);
    const fx = bx + para(cost(bx - 1, by), best, cost(bx + 1, by));
    const fy = by + para(cost(bx, by - 1), best, cost(bx, by + 1));
    return { dx: fx * 2, dy: fy * 2, cost: best, ratio, edge: Math.abs(bx - pc) === range };
  }

  /* 帯の上側・下側それぞれの縦ずれ（半分の解像度、小数）。上下で違えば、大きさの見積もりがずれている */
  function bandDy(a, b, dxH, y0, y1, dyC) {
    const { W2 } = a, x0 = a.t0, x1 = a.t1;
    const c = (dy) => {
      let s = 0, n = 0;
      for (let y = y0; y < y1; y++) { const yb = y + dy; if (yb < 0 || yb >= a.H2) continue; const ra = y * W2, rb = yb * W2 + dxH; for (let x = x0; x < x1; x++) { s += Math.abs(a.d[ra + x] - b.d[rb + x]); n++; } }
      return n ? s / n : Infinity;
    };
    let best = Infinity, by = 0; const cs = {};
    for (let dy = dyC - 5; dy <= dyC + 5; dy++) { cs[dy] = c(dy); if (cs[dy] < best) { best = cs[dy]; by = dy; } }
    if (by === dyC - 5 || by === dyC + 5) return null;
    const l = cs[by - 1], r = cs[by + 1], den = l - 2 * best + r;
    const sorted = Object.values(cs).sort((p, q) => p - q);
    if (sorted[sorted.length >> 1] / Math.max(best, 1e-6) < 1.25) return null;
    return by + (den > 0 ? clamp(0.5 * (l - r) / den, -0.5, 0.5) : 0);
  }

  /* ---------- 追従：「回り方」から缶の位置と大きさを求める ----------
   * 回る円柱の表面は、中心ほど速く横に流れ、輪郭に近づくほど遅くなる（v = t + ω·√(R² − (x − cx)²)）。
   * 背景は止まっているか、スマホの揺れの分だけ一様にずれる（v = b）。
   * 前のコマとの横の動きを細かく測り、この形を当てはめると、色に関係なく缶の中心 cx と半径 R が求まる。
   * （缶が滑る・奥へ動く・背景と缶の色が近い、に対応するため） */
  /* 1周の照合用：粗く広く探してから細かく（上下に大きくずれていても見つけられるように） */
  /* b を縦に s 倍した像（中心の行のまわりで）。1周の間に大きさの見積もりが少しずれた時の照合用 */
  function scaleV(b, s) {
    const { W2, H2 } = b, c = H2 / 2, d = new Float32Array(W2 * H2);
    for (let y = 0; y < H2; y++) {
      const yf = c + (y - c) * s, y0 = Math.floor(yf), fy = yf - y0;
      if (y0 < 0 || y0 >= H2 - 1) continue;
      const r0 = y0 * W2, r1 = r0 + W2, ro = y * W2;
      for (let x = 0; x < W2; x++) d[ro + x] = b.d[r0 + x] * (1 - fy) + b.d[r1 + x] * fy;
    }
    return { ...b, d };
  }
  function matchWide(a, b, dyR) {
    const { W2, H2 } = a, x0 = a.t0, x1 = a.t1, lim = Math.min(x0, W2 - x1) - 1;
    let best = Infinity, bx = 0, by = 0;
    for (let dx = -lim; dx <= lim; dx += 2) for (let dy = -dyR; dy <= dyR; dy += 2) {
      let s = 0, n = 0;
      for (let y = 8; y < H2 - 8; y += 4) {
        const yb = y + dy; if (yb < 0 || yb >= H2) continue;
        const ra = y * W2, rb = yb * W2 + dx;
        for (let x = x0; x < x1; x += 2) { s += Math.abs(a.d[ra + x] - b.d[rb + x]); n++; }
      }
      const v = n > 50 ? s / n : Infinity;
      if (v < best) { best = v; bx = dx; by = dy; }
    }
    return match(a, b, bx * 2, 3, 3, by);
  }

  /* 目線の高さの推定。円柱が角速度 ω で回ると、高さ h の円の点は縦に vy = −e(h)·ω·u（u = (x − cx)/R）動く。
   * e(h) = k(h − yEye) なので、いくつかの高さ・左右で縦の動きを測って k と yEye を求める */
  const dur0 = (v) => v.duration;
  async function estimateEye(video, grab, geo, dur) {
    const X = [], Y = [], V = [], nofit = [];
    let fits = 0;
    for (let i = 0; i < 7 && fits < 4; i++) {
      const T0 = dur * (0.12 + i * 0.12);
      await seekTo(video, T0); const A = grab();
      await seekTo(video, T0 + 0.12); const B = grab();
      const GA = halfGray(A), GB = halfGray(B), ox = A.ox, oy = A.oy;
      const yA = (geo.top + (geo.bot - geo.top) * 0.1 - oy) / 2, yB = (geo.bot - (geo.bot - geo.top) * 0.05 - oy) / 2;
      const fl = bandFlow(GA, GB, Math.round(yA), Math.round(yB), 32);
      const fit = fitCylinder(fl, (geo.cx - ox) / 2, geo.hw / 2, true);
      if (!fit || Math.abs(fit.om) < 0.02) { nofit.push([fl.length, fit ? +fit.om.toFixed(3) : null]); continue; }
      fits++;
      const w = GA.w, BS = 7;
      for (let h = yA; h < yB; h += 12) for (const u of [-0.75, -0.6, 0.6, 0.75]) {
        const xc = Math.round(fit.cx + u * fit.R), yc = Math.round(h);
        if (xc - BS - 30 < 0 || xc + BS + 30 >= w || yc - BS - 14 < 0 || yc + BS + 14 >= GA.h) continue;
        const px = fit.t + fit.om * Math.sqrt(1 - u * u) * fit.R;
        let best = Infinity, bx = 0, by = 0;
        const cost = (dx, dy) => { let c = 0; for (let yy = -BS; yy <= BS; yy++) { const ra = (yc + yy) * w + xc, rb = (yc + yy + dy) * w + xc + dx; for (let xx = -BS; xx <= BS; xx++) c += Math.abs(GA.g[ra + xx] - GB.g[rb + xx]); } return c; };
        let vr = 0, mean = 0; for (let yy = -BS; yy <= BS; yy++) for (let xx = -BS; xx <= BS; xx++) mean += GA.g[(yc + yy) * w + xc + xx];
        mean /= (2 * BS + 1) ** 2;
        for (let yy = -BS; yy <= BS; yy++) for (let xx = -BS; xx <= BS; xx++) vr += (GA.g[(yc + yy) * w + xc + xx] - mean) ** 2;
        if (vr / (2 * BS + 1) ** 2 < 60) continue;      // 模様がない所は測れない
        const p0 = Math.round(px);
        for (let dy = -12; dy <= 12; dy++) for (let dx = p0 - 4; dx <= p0 + 4; dx++) { const c = cost(dx, dy); if (c < best) { best = c; bx = dx; by = dy; } }
        if (Math.abs(by) >= 12) continue;
        const l = cost(bx, by - 1), r = cost(bx, by + 1);
        const vy = by + clamp(0.5 * (l - r) / (l - 2 * best + r || 1e-6), -0.5, 0.5);
        // 基準座標で：h_w = 2h + oy、vy_w = 2vy、om は角速度（1コマあたり）
        const hw_ = 2 * h + oy, a = fit.om * u;
        X.push(hw_ * a); Y.push(a); V.push(2 * vy);
      }
    }
    if (X.length < 20) return { fail: 'samples', n: X.length, fits, nofit };
    // V = −k·hw·a + k·yEye·a を最小二乗で（外れ値は2回目で除く）
    const solve = (idx) => {
      let sxx = 0, sxy = 0, syy = 0, sxv = 0, syv = 0;
      for (const i of idx) { sxx += X[i] * X[i]; sxy += X[i] * Y[i]; syy += Y[i] * Y[i]; sxv += X[i] * V[i]; syv += Y[i] * V[i]; }
      const det = sxx * syy - sxy * sxy; if (Math.abs(det) < 1e-9) return null;
      const A = (syy * sxv - sxy * syv) / det, Bc = (sxx * syv - sxy * sxv) / det;
      return { A, B: Bc };
    };
    let idx = X.map((_, i) => i), r = solve(idx);
    if (!r) return null;
    const res = idx.map((i) => Math.abs(V[i] - (r.A * X[i] + r.B * Y[i])));
    const med = res.slice().sort((a, b) => a - b)[res.length >> 1];
    idx = idx.filter((i, j) => res[j] < Math.max(1.5, med * 2.5));
    r = solve(idx); if (!r) return null;
    const k = -r.A, yEye = r.B / k;
    if (!(k > 0.01 && k < 0.5) || !isFinite(yEye)) return { fail: 'range', k, yEye, n: idx.length, fits };
    return { k, yEye, n: idx.length, fits };
  }

  /* 切り抜き画面の初期の枠：「回っている所」を探す（背景と缶の色が近くても、手が写っていても見つけられる）。
   * 撮り始めの数秒のコマの組で横の動きを測り、画面全体で円柱の流れ方を当てはめる */
  async function detectByMotion(video) {
    const vw = video.videoWidth, vh = video.videoHeight, kk = WORK_W / Math.min(vw, vh);
    const W = Math.round(vw * kk), H = Math.round(vh * kk);
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d', { willReadFrequently: true });
    const grab = () => { ctx.drawImage(video, 0, 0, W, H); return { data: ctx.getImageData(0, 0, W, H).data, W, H, ox: 0, oy: 0, f: 1 }; };
    const dur = video.duration, res = [];
    // 撮り始めは止めていることが多いので、1.5 秒あたりから。回っている組が3つ集まるまで
    for (const T0 of [1.5, 2.3, 3.1, 3.9, 4.8, 6, 7.5, 9].filter((t) => t < dur - 0.3)) {
      if (res.length >= 3) break;
      await seekTo(video, T0); const imA = grab(); const A = halfGray(imA);
      await seekTo(video, T0 + 0.12); const B = halfGray(grab());
      // 指（肌色）の所は使わない
      let fl = bandFlow(A, B, Math.round(A.h * 0.05), Math.round(A.h * 0.97), 32);
      fl = fl.filter(([x, , , y]) => { const o = ((Math.round(y) * 2) * W + x * 2) * 4; return !isSkin(imA.data[o], imA.data[o + 1], imA.data[o + 2]); });
      if (fl.length < 30) continue;
      // 1) 缶のある行：横の動きが大きく、指（肌色）がほとんどない行。背景の動き（スマホの揺れ）を引いて比べる
      const bgV = fl.map((r) => r[1]).sort((p, q) => p - q)[fl.length >> 1];
      const byRow = new Map();
      for (const r of fl) { const k = r[3]; if (!byRow.has(k)) byRow.set(k, []); byRow.get(k).push(r); }
      const rowsY = [...byRow.keys()].sort((p, q) => p - q);
      const skinFrac = (y) => {           // その行（基準解像度）の肌色の割合
        const Y = Math.round(y * 2); let n = 0, k = 0;
        for (let x = 0; x < W; x += 4) { const o = (Y * W + x) * 4; k++; if (isSkin(imA.data[o], imA.data[o + 1], imA.data[o + 2])) n++; }
        return n / k;
      };
      const en = rowsY.map((y) => {
        const v = byRow.get(y).map((r) => Math.abs(r[1] - bgV)).sort((p, q) => p - q);
        return v[Math.floor(v.length * 0.8)] || 0;
      });
      const e90 = en.slice().sort((p, q) => p - q)[Math.floor(en.length * 0.9)];
      if (e90 < 2) continue;                       // ほとんど回っていない
      let bs = 0, be = 0, bsum = 0, s0 = -1, gap = 0, sum = 0;
      for (let i = 0; i <= rowsY.length; i++) {
        const ok = i < rowsY.length && en[i] > e90 * 0.35;
        if (ok) { if (s0 < 0) { s0 = i; sum = 0; } sum += en[i]; gap = 0; if (sum > bsum) { bsum = sum; bs = s0; be = i + 1; } }
        else if (s0 >= 0 && (i >= rowsY.length || ++gap > 1)) { s0 = -1; gap = 0; }
      }
      if (be - bs < 3) continue;
      const yLo = rowsY[bs], yHi = rowsY[be - 1];
      // 2) その行の横の動きを、列ごとの中央値の「山」にして、半楕円 A·√(1 − ((x − c)/R)²) を当てはめる
      const cols = new Map();
      for (let i = bs; i < be; i++) for (const r of byRow.get(rowsY[i]) || []) { if (!cols.has(r[0])) cols.set(r[0], []); cols.get(r[0]).push(r[1] - bgV); }
      const P = [...cols.entries()].map(([x, vs]) => [x, vs.sort((p, q) => p - q)[vs.length >> 1]]).sort((p, q) => p[0] - q[0]);
      let best = null;
      for (let c = A.w * 0.15; c <= A.w * 0.85; c += 2) for (let R = A.w * 0.06; R <= A.w * 0.45; R *= 1.02) {
        let sq = 0, sv = 0, err = 0;
        for (const [x, v] of P) { const u = (x - c) / R; if (Math.abs(u) < 1) { const q = Math.sqrt(1 - u * u); sq += q * q; sv += q * v; } }
        if (sq < 3) continue;
        const Am = sv / sq;
        for (const [x, v] of P) { const u = (x - c) / R; const pred = Math.abs(u) < 1 ? Am * Math.sqrt(1 - u * u) : 0; err += Math.min((v - pred) ** 2, 25); }
        if (!best || err < best.err) best = { cx: c, R, Am, err };
      }
      if (!best || Math.abs(best.Am) < 1.5) continue;
      // 3) 缶の行を絞る：その行の動きが半楕円の形に合っている行（缶をつまむ手の行は合わない）
      const good = rowsY.map((y) => {
        const rs = byRow.get(y) || []; let sab = 0, saa = 0, sbb = 0, n = 0;
        for (const r of rs) {
          const u = (r[0] - best.cx) / best.R; if (Math.abs(u) > 1.3) continue;
          const pa = Math.abs(u) < 1 ? best.Am * Math.sqrt(1 - u * u) : 0, pb = r[1] - bgV;
          sab += pa * pb; saa += pa * pa; sbb += pb * pb; n++;
        }

    // 各列で、正面に近いコマほど重く（±3° 程度が主）、くっきりしたコマほど重く（手ぶれ・回転ぶれのコマを抑える）。

        const [sx, sy] = pos(e);
        const hs = this.handles();
        let best = null, bd = 30;
        for (const name of ['top', 'bot', 'left', 'right']) {
          const [hx, hy] = this.toScreen(...hs[name]);
          const d = Math.hypot(hx - sx, hy - sy);
          if (d < bd) { bd = d; best = name; }
        }
        const [ix, iy] = this.toImage(sx, sy);
        const g = hs.g;
        if (!best && ix > g.L && ix < g.R && iy > g.top && iy < g.bot) best = 'move';
        if (!best) return;
        drag = { name: best, ix, iy, p0: { ...this.p } };
        cv.setPointerCapture(e.pointerId);
        e.preventDefault();
      });
      cv.addEventListener('pointermove', (e) => {
        if (!drag) return;
        const [ix, iy] = this.toImage(...pos(e));
        const iw = this.src.width, ih = this.src.height;
        const p = { ...drag.p0 };
        const L = (p.cx - p.w / 2) * iw, R = (p.cx + p.w / 2) * iw;
        if (drag.name === 'top') p.top = clamp(iy / ih, 0, p.bot - 0.05);
        if (drag.name === 'bot') p.bot = clamp(iy / ih, p.top + 0.05, 1);
        if (drag.name === 'left') { const nl = Math.min(ix, R - 10); p.cx = (nl + R) / 2 / iw; p.w = (R - nl) / iw; }
        if (drag.name === 'right') { const nr = Math.max(ix, L + 10); p.cx = (L + nr) / 2 / iw; p.w = (nr - L) / iw; }
        if (drag.name === 'move') {
          const dx = (ix - drag.ix) / iw, dy = (iy - drag.iy) / ih;
          p.cx += dx; p.top += dy; p.bot += dy;
        }
        p.auto = false;
        this.p = p;
        this.draw();
        this.onChange(p);
      });
      const end = () => { drag = null; };
      cv.addEventListener('pointerup', end);
      cv.addEventListener('pointercancel', end);
    }
  }

  /* 切り抜きのライブプレビュー（棚板の上に置いた見た目） */
  function drawPreview(cv, src, p) {
    const ctx = cv.getContext('2d');
    const W = cv.width, H = cv.height;
    ctx.clearRect(0, 0, W, H);
    const g = NS.cutout.geom(p, src.width, src.height);
    const ch = H * 0.82, k = ch / (g.bot - g.top), cw = g.w * k;
    const x = (W - cw) / 2, y = H * 0.9 - ch;
    // 接地影
    const sh = ctx.createRadialGradient(W / 2, H * 0.9, 1, W / 2, H * 0.9, cw * 0.62);
    sh.addColorStop(0, 'rgba(0,0,0,0.7)'); sh.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.save(); ctx.translate(W / 2, H * 0.9); ctx.scale(1, 0.16); ctx.translate(-W / 2, -H * 0.9);
    ctx.fillStyle = sh; ctx.fillRect(0, H * 0.9 - cw, W, cw * 2); ctx.restore();
    ctx.save();
    ctx.translate(x, y); ctx.scale(k, k); ctx.translate(-g.L, -g.top);
    NS.cutout.silhouette(ctx, g, NS.cutout.SHAPE.inset * g.w);
    ctx.clip();
    ctx.drawImage(src, 0, 0);
    ctx.restore();
  }

  /* ---------- 共通：フルスクリーンのフロー ---------- */
  function openFlow(html) {
    const root = $('#flow-root');
    root.innerHTML = `<div class="flow" role="dialog" aria-modal="true">${html}</div>`;
    root.classList.add('open');
    requestAnimationFrame(() => root.classList.add('visible'));
    return root.firstElementChild;
  }
  function closeFlow() {
    const root = $('#flow-root');
    root.classList.remove('visible');
    setTimeout(() => { root.classList.remove('open'); root.innerHTML = ''; }, 280);
  }

  const backIcon = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';
  const closeIcon = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';

  /* ---------- 切り抜き調整ステップ（登録・再調整で共用） ---------- */
  /** 自動検出：輪郭 ＋ 傾き（確信が持てない傾きは 0 のまま＝手動で調整） */
  function detectFull(src) {
    const p = NS.cutout.detectBest(src);
    try { p.angle = NS.cutout.autoTilt(src, p); } catch (e) { p.angle = 0; }
    return p;
  }

  function cutStep(flow, src, params, { title, next, onBack, onNext }) {
    flow.innerHTML = `
      <header class="flow-head">
        <button class="icon-btn" data-a="back" aria-label="戻る">${onBack ? backIcon : closeIcon}</button>
        <div><h2>${title}</h2><p class="flow-step">${title === '缶を登録' ? '2 / 3　切り抜き' : '缶の輪郭に合わせて調整'}</p></div>
        <span class="icon-btn placeholder"></span>
      </header>
      <div class="cut-body">
        <div class="ed-host"></div>
        <aside class="cut-side">
          <canvas class="pv" width="240" height="380"></canvas>
          <p class="pv-label">棚での見え方</p>
        </aside>
      </div>
      <label class="tilt-row"><span>傾き</span>
        <input type="range" min="-10" max="10" step="0.1" class="tilt" aria-label="傾き補正">
        <output class="tilt-val"></output>
      </label>
      <p class="cut-tip">● をドラッグして上下左右の端を合わせます。缶の内側をドラッグすると全体を移動できます。</p>
      <footer class="flow-foot">
        <button class="btn ghost" data-a="auto">自動で合わせ直す</button>
        <button class="btn primary" data-a="next">${next}</button>
      </footer>`;
    const pv = flow.querySelector('.pv');
    const tilt = flow.querySelector('.tilt'), tiltVal = flow.querySelector('.tilt-val');
    let p = { angle: 0, ...params };
    let view = NS.cutout.rotated(src, p, p.angle);   // 傾き補正後の画像で輪郭を合わせる
    let raf = 0;
    const refresh = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => drawPreview(pv, view, p)); };
    const showTilt = () => { tilt.value = p.angle; tiltVal.textContent = (p.angle > 0 ? '+' : '') + (+p.angle).toFixed(1) + '°'; };
    const ed = new CutEditor(flow.querySelector('.ed-host'), view, p, (np) => { p = { ...np, angle: p.angle }; refresh(); });
    showTilt(); refresh();
    let tiltT = 0;
    tilt.addEventListener('input', () => {
      p.angle = +tilt.value; showTilt();
      clearTimeout(tiltT);
      tiltT = setTimeout(() => { view = NS.cutout.rotated(src, p, p.angle); ed.src = view; ed.setParams(p, false); refresh(); }, 60);
    });
    flow.onclick = async (e) => {
      const a = e.target.closest('[data-a]');
      if (!a) return;
      if (a.dataset.a === 'back') { ed.destroy(); onBack ? onBack() : closeFlow(); }
      if (a.dataset.a === 'auto') {
        p = detectFull(src); view = NS.cutout.rotated(src, p, p.angle); ed.src = view;
        ed.setParams(p, true); showTilt(); refresh();
      }
      if (a.dataset.a === 'next') { ed.destroy(); onNext(p); }
    };
  }

  /* ---------- 保存前の確認：切り抜き＋自動補正の結果 ---------- */
  async function processed(src, params) {
    const cut = await NS.cutout.render(src, params, 1400);
    const rawURL = URL.createObjectURL(cut.blob);
    let tone = null;
    try { tone = await NS.tone.analyzeURL(rawURL); } catch (e) { tone = null; }
    const shownURL = tone ? await NS.tone.displayURL(rawURL, 'preview:' + rawURL, tone) : rawURL;
    return { cut, rawURL, tone, shownURL };
  }
  function previewBlock(res, toneOn) {
    const glare = res.tone && res.tone.glare > 0.03;
    return `
      <div class="info-can"><img class="pv-img" src="${toneOn ? res.shownURL : res.rawURL}" alt="">
        <label class="tone-toggle"><input type="checkbox" class="tone-on" ${toneOn ? 'checked' : ''}> 明るさ・色を自動補正</label>
      </div>
      ${glare ? '<p class="warn">強い光の反射が写っています。白く飛んだ部分は補正できないため、気になる場合は照明の映り込みを避けて撮り直してください。</p>' : ''}`;
  }
  function bindPreview(flow, res, state) {
    const cb = flow.querySelector('.tone-on');
    if (cb) cb.addEventListener('change', () => { state.toneOn = cb.checked; flow.querySelector('.pv-img').src = cb.checked ? res.shownURL : res.rawURL; });
  }

  /* ---------- 新規登録 ---------- */
  /* 思い出の写真（任意・1枚）：棚には並べない */
  function memoryHTML(url) {
    return `
      <div class="field memo-field"><span>思い出の写真 <em class="opt">任意・1枚</em></span>
        <div class="memo-box">
          <img class="memo-img" alt="" ${url ? `src="${url}"` : 'hidden'}>
          <label class="memo-pick">${url ? '写真を変更' : '＋ 一緒に食べた料理や、その日の写真を追加'}
            <input type="file" accept="image/*" class="memo-input" hidden></label>
          <button type="button" class="memo-clear" ${url ? '' : 'hidden'}>削除</button>
        </div>
      </div>`;
  }
  function bindMemory(root, state) {
    const inp = root.querySelector('.memo-input'), img = root.querySelector('.memo-img');
    const pick = root.querySelector('.memo-pick'), clr = root.querySelector('.memo-clear');
    inp.addEventListener('change', async () => {
      const f = inp.files && inp.files[0]; if (!f) return;
      const cv = await loadFile(f);
      state.memoBlob = await new Promise((r) => cv.toBlob(r, 'image/jpeg', 0.86)); state.memoCleared = false;
      img.src = URL.createObjectURL(state.memoBlob); img.hidden = false; clr.hidden = false;
      pick.firstChild.textContent = '写真を変更';
    });
    clr.addEventListener('click', () => {
      state.memoBlob = null; state.memoCleared = true; img.hidden = true; clr.hidden = true;
      pick.firstChild.textContent = '＋ 一緒に食べた料理や、その日の写真を追加';
    });
  }

  function startRegister(onSaved) {
    const flow = openFlow('');
    let src = null, params = null, mode = 'photo';
    let video = null, spin = null;            // 360° のとき：{ blob, aspect, stats, url }
    const ui = { toneOn: true }, memo = {};

    const stepPhoto = () => {
      flow.innerHTML = `
        <header class="flow-head">
          <button class="icon-btn" data-a="close" aria-label="閉じる">${closeIcon}</button>
          <div><h2>缶を登録</h2><p class="flow-step">1 / 3　撮影</p></div>
          <span class="icon-btn placeholder"></span>
        </header>
        <div class="photo-pick">
          <div class="seg" role="tablist">
            <button role="tab" data-mode="photo" aria-selected="${mode === 'photo'}">写真</button>
            <button role="tab" data-mode="video" aria-selected="${mode === 'video'}">360° 動画</button>
          </div>
          <div class="guide">
            <svg viewBox="0 0 120 200" class="guide-can" aria-hidden="true"><path d="M30 18 Q60 6 90 18 L102 40 L102 178 Q60 194 18 178 L18 40 Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-dasharray="6 6"/></svg>
            ${mode === 'photo' ? `<ul class="guide-list">
              <li><b>正面</b>から、缶の高さの真ん中あたりで撮る</li>
              <li>缶の<b>上から下まで全体</b>が写るように</li>
              <li><b>フラッシュは使わない</b>（反射で白く飛びます）</li>
              <li><b>無地の壁</b>の前に置くと、きれいに切り抜けます</li>
            </ul>` : `<ul class="guide-list">
              <li>缶を画面の<b>中央</b>に。上から下まで全体が入る距離で</li>
              <li>スマホは<b>机などに立てかけて固定</b>し、缶の<b>フタをつまんで</b>その場で回す</li>
              <li><b>1周と少し</b>（最初の正面を過ぎるまで）を<b>10秒くらい</b>でゆっくり</li>
              <li>缶が<b>左右に動かない</b>ように。撮り始めは1秒ほど止めてから回す</li>
              <li>缶の<b>側面は手で隠さない</b>でください</li>
            </ul>`}
          </div>
          ${mode === 'video' ? (NS.capture && NS.capture.available()
            ? `<button class="pick-btn primary" data-a="live"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg>ガイド付きで撮影（おすすめ）</button>`
            : `<p class="live-na">ガイド付き撮影は、カメラが使えるページ（https）でのみ使えます</p>`) : ''}
          <label class="pick-btn ${mode === 'video' && NS.capture && NS.capture.available() ? '' : 'primary'}">
            <input type="file" accept="${mode === 'photo' ? 'image/*' : 'video/*'}" capture="environment" hidden>
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
            ${mode === 'photo' ? 'カメラで撮影' : 'カメラで動画を撮る'}
          </label>
          <label class="pick-btn">
            <input type="file" accept="${mode === 'photo' ? 'image/*' : 'video/*'}" hidden>
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/><circle cx="15.5" cy="8.5" r="1.5"/></svg>
            ${mode === 'photo' ? '写真を選ぶ' : '動画を選ぶ'}
          </label>
          <p class="busy" hidden>${mode === 'photo' ? '写真を読み込み、缶を探しています…' : '動画を読み込んでいます…'}</p>
        </div>`;
      flow.onclick = (e) => {
        if (e.target.closest('[data-a="close"]')) closeFlow();
        const m = e.target.closest('[data-mode]'); if (m && m.dataset.mode !== mode) { mode = m.dataset.mode; stepPhoto(); }
        if (e.target.closest('[data-a="live"]')) stepLive();
      };
      flow.querySelectorAll('input[type=file]').forEach((inp) => inp.addEventListener('change', async () => {
        const f = inp.files && inp.files[0];
        if (!f) return;
        const busy = flow.querySelector('.busy'); busy.hidden = false;
        try {
          if (mode === 'photo') {
            src = await loadFile(f); spin = null;
          } else {
            const ff = await NS.spin360.firstFrame(f);
            video = ff; ff.name = f.name; ff.type = f.type; ff.size = f.size; src = ff.frame; spin = null;
          }
          await new Promise((r) => setTimeout(r, 30));
          if (mode === 'video') {
            busy.textContent = '缶の位置を探しています…';
            params = videoParams(src) || detectFull(src);   // 動きからの検出は、まだ安定しないので使わない
          } else params = detectFull(src);
          if (NS.__testParams) params = { ...NS.__testParams };   // 自動テスト用
          stepCut();
        } catch (err) {
          busy.textContent = (err && err.message) || '読み込めませんでした。別のファイルを選んでください。';
        }
      }));
    };

    /* ガイド付き撮影：録画しながら回った角度を数え、1周したら自動で止める。枠の位置はそのまま切り抜きに使う */
    const stepLive = async () => {
      flow.onclick = null;
      const r = await NS.capture.run(flow);
      if (!r) { stepPhoto(); return; }
      flow.innerHTML = `<div class="photo-pick"><p class="busy">撮影した動画を読み込んでいます…</p></div>`;
      try {
        const ff = await NS.spin360.firstFrame(r.file);
        video = ff; ff.name = r.file.name; ff.type = r.file.type; ff.size = r.file.size; ff.live = { deg: Math.round(r.deg), secs: +r.secs.toFixed(1), mime: r.mime, w: r.w, h: r.h };
        src = ff.frame; spin = null; params = { ...r.params };
        stepCut();
      } catch (err) {
        flow.innerHTML = `<div class="photo-pick"><p class="busy">${(err && err.message) || '撮影した動画を読み込めませんでした'}</p><button class="pick-btn" data-a="back">戻る</button></div>`;
        flow.onclick = (e) => { if (e.target.closest('[data-a="back"]')) stepPhoto(); };
      }
    };

    /* 360° 動画：缶の上を手でつまむので、写真用の検出は手を缶と間違えやすい。
     * 缶の左右の縦の輪郭と胴の上下（360° の処理と同じ方法）から枠を決める */
    // 回っている所から缶を探す（色や背景に左右されにくい）
    async function motionParams(v, cv) {
      try {
        const g = await NS.fastSpin.detectByMotion(v);
        if (!g) return null;
        const w = g.hw * 2;
        if (!(w > g.W * 0.12) || !(g.bot - g.top > w * 0.6)) return null;
        const top = g.top - w * 0.2, bot = g.bot + w * 0.1;   // 胴の上下に、肩とフタ・底のすぼまりの分を足す
        return { cx: g.cx / g.W, w: w / g.W, top: Math.max(0, top / g.H), bot: Math.min(1, bot / g.H), angle: 0 };
      } catch (e) { return null; }
    }
    function videoParams(cv) {
      try {
        const W = cv.width, H = cv.height;
        const d = cv.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, W, H).data;
        const g = NS.fastSpin.measure(d, W, H);
        const w = g.hw * 2;
        const hh = g.bot - g.top;
        // 缶の胴は幅の約 1.2〜2.4 倍の高さ。外れていれば検出失敗として、写真用の検出に回す
        if (!(w > W * 0.15) || !(hh > w * 1.1) || !(hh < w * 2.6)) return null;
        const top = g.top - w * 0.2, bot = g.bot + w * 0.1;   // 肩とフタ、底のすぼまりの分を足す
        return { cx: g.cx / W, w: w / W, top: Math.max(0, top / H), bot: Math.min(1, bot / H), angle: 0 };
      } catch (e) { return null; }
    }

    const stepCut = () => cutStep(flow, src, params, {
      title: '缶を登録', next: mode === 'video' ? '360° を生成' : '次へ',
      onBack: stepPhoto,
      onNext: (p) => { params = p; if (mode === 'video') stepGenerate(); else stepInfo(info); },
    });
    let info = {};

    /* 360°：生成（デバッグ用に工程ごとの時間を表示） */
    const stepGenerate = async () => {
      flow.innerHTML = `
        <header class="flow-head">
          <button class="icon-btn" data-a="back" aria-label="戻る">${backIcon}</button>
          <div><h2>缶を登録</h2><p class="flow-step">2 / 3　360° を生成</p></div>
          <span class="icon-btn placeholder"></span>
        </header>
        <div class="gen">
          <p class="gen-msg">動画から 360° のラベルを作っています…</p>
          <div class="gen-bar"><i style="width:0%"></i></div>
          <p class="gen-time">0.0 秒</p>
        </div>`;
      let cancelled = false;
      flow.onclick = (e) => { if (e.target.closest('[data-a="back"]')) { cancelled = true; stepCut(); } };
      const bar = flow.querySelector('.gen-bar i'), msg = flow.querySelector('.gen-msg'), tm = flow.querySelector('.gen-time');
      const t0 = performance.now();
      const tick = setInterval(() => { tm.textContent = ((performance.now() - t0) / 1000).toFixed(1) + ' 秒'; }, 100);
      try {
        // 軽量版（端末内で約10秒）：動画を4倍速で再生しながら、約15コマ/秒を展開・位置合わせ
        msg.textContent = '動画を読み取りながら、ラベルを展開しています…';
        const res = await NS.fastSpin.generate(video.video, {
          params, playbackRate: 4, debug: (d) => { NS.__fastDbg = d; NS.__lastParams = params; },   // __fastDbg：実機テスト用の診断情報
          onProgress: (f) => { if (!cancelled) bar.style.width = (f * 92) + '%'; },
        });
        clearInterval(tick);
        if (cancelled) return;
        spin = { ...res, url: URL.createObjectURL(res.blob) };
        stepResult();
      } catch (err) {
        clearInterval(tick);
        if (cancelled) return;
        msg.textContent = '生成に失敗しました：' + ((err && err.message) || err);
      }
    };

    const stepResult = () => {
      const s = spin.stats;
      const short = s.quality === 'poor' && s.turn && s.turn < 380;
      const verdict = short
        ? `回した量が1周に足りませんでした（約 ${Math.round(s.turn)}°）。最初の正面をはっきり過ぎるまで、もう少し長く回して撮り直してください`
        : { good: 'きれいに1周つながりました', fair: '1周つながりましたが、回転が1周に少し足りない可能性があります', poor: '1周を確認できませんでした（回し方が足りない／缶を見失った可能性）' }[s.quality];
      flow.innerHTML = `
        <header class="flow-head">
          <button class="icon-btn" data-a="back" aria-label="戻る">${backIcon}</button>
          <div><h2>缶を登録</h2><p class="flow-step">2 / 3　360° の確認</p></div>
          <span class="icon-btn placeholder"></span>
        </header>
        <div class="spin-stage"><canvas class="spin-cv"></canvas></div>
        <p class="gen-verdict ${s.quality}">${verdict}</p>
        <p class="gen-debug">${NS.spin360.fmtStats(s)}</p>
        <details class="gen-flat"><summary>展開図を見る</summary><img src="${spin.url}" alt="ラベルの展開図"></details>
        <button class="link-btn gen-diag" data-a="diag">診断データを保存（うまくいかない時に送ってください）</button>
        <footer class="flow-foot">
          <button class="btn ghost" data-a="retake">撮り直す</button>
          <button class="btn primary" data-a="next">次へ</button>
        </footer>`;
      const viewer = new NS.spin360.Viewer(flow.querySelector('.spin-cv'), spin.url, spin.aspect);
      flow.onclick = (e) => {
        const a = e.target.closest('[data-a]'); if (!a) return;
        if (a.dataset.a === 'back') { viewer.destroy(); stepCut(); }

  const byId = (id) => state.cans.find((c) => c.id === id);

  /* ---------- 画像 ----------
   * 初期データの缶は3段階で見せる：
   *   1) 起動直後：HTML 同梱の縦96px（t）を全缶に即表示（ぼんやりでも「並んでいる」状態を先に作る）
   *   2) 棚用の縦540px（m）を、いま見えている範囲 → 右へ → 左へ の順に3本ずつ並行で差し替え

  const artLevel = new Map();               // id → 0: t, 1: m
  const SIZE_OF = ['t', 'm'];
  async function ensureArt(id, force, level) {
    const have = artLevel.has(id) ? artLevel.get(id) : -1;
    const want = level != null ? level : Math.max(have, 0);
    if (!force && artURL.has(id) && have >= want) return artURL.get(id);
    const c = byId(id);
    if (!c) return null;
    const url = await NS.images.canURL(c, SIZE_OF[want]);
    if (!force && (artLevel.get(id) ?? -1) > want) return artURL.get(id);   // 先に高画質が届いていたら戻さない
    artURL.set(id, url);
    artLevel.set(id, NS.images.isSeed(c) ? want : 1);

  const pendingHD = new Set();

  function hdPriority(id) {
    const m = shelf.m, sc = shelf.scroller;
    if (document.body.dataset.view === 'backyard' && state.backyard.includes(id)) return state.backyard.indexOf(id);
    let t = -1, col = -1;
    for (let k = 0; k < state.tiers.length; k++) { const i = state.tiers[k].indexOf(id); if (i >= 0) { t = k; col = i; break; } }
    if (t < 0 || !m) return 1e6 + state.backyard.indexOf(id);

    return y >= B ? 1000 + (y - B) / m.rowH * 100 + col : 50000 + (T - y) / m.rowH * 100 + col;   // 下の段 → 上の段
